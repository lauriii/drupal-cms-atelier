langcode: en
status: true
dependencies: {  }
machineName: hero
name: Hero
props:
  eyebrow:
    type: string
    title: Eyebrow
    description: 'A short line above the headline. Where the studio is, what the page is, that kind of thing.'
    examples:
      - 'Drupal Canvas'
  title:
    type: string
    title: Title
    examples:
      - 'A component library your editors can actually use'
  lede:
    type: string
    title: Lede
    description: 'One or two sentences under the headline. Keep it to what a reader needs before the first link.'
    examples:
      - 'Authored as React. Composed in Drupal. Shipped without a deploy.'
  image:
    type: object
    $ref: 'json-schema-definitions://canvas.module/image'
    title: Image
    description: 'Sits beside the text on a wide screen and above it on a phone. Leave it empty for a text-only opening.'
    examples:
      -
        src: 'https://placehold.co/1200x900@2x.png?alternateWidths=https%3A%2F%2Fplacehold.co%2F%7Bwidth%7Dx%7Bheight%7D%402x.png'
        alt: 'Example image placeholder'
        width: 1200
        height: 900
required:
  - title
slots:
  content:
    title: Actions
js:
  original: "import { cn, Image } from 'drupal-canvas';\n\n/**\n * Hero — one statement, one image, side by side.\n *\n * The image sits beside the text rather than under it, so the opening screen\n * carries both. Below the medium breakpoint it goes above the words: a reader\n * on a phone should meet the work before the paragraph about it.\n */\nconst Hero = ({ eyebrow, title, lede, image, content }) => (\n  <section className=\"bg-paper\">\n    <div\n      className={cn(\n        'mx-auto max-w-page px-6 pt-10 pb-12 md:px-10 md:pt-20 md:pb-24',\n        image && 'md:grid md:grid-cols-12 md:items-center md:gap-x-12',\n      )}\n    >\n      {image ? (\n        <div className=\"mb-10 md:order-2 md:col-span-6 md:mb-0 lg:col-span-7\">\n          {/* The largest thing above the fold on every page, so it loads first. */}\n          <Image\n            {...image}\n            loading=\"eager\"\n            fetchPriority=\"high\"\n            sizes=\"(min-width: 1024px) 58vw, (min-width: 768px) 50vw, 100vw\"\n            className=\"w-full\"\n          />\n        </div>\n      ) : null}\n      <div\n        className={cn(\n          image ? 'md:order-1 md:col-span-6 lg:col-span-5' : 'max-w-[52rem]',\n        )}\n      >\n        {eyebrow ? <p className=\"text-key text-ink-muted\">{eyebrow}</p> : null}\n        <h1\n          className={cn(\n            'font-display tracking-display mt-5 font-light text-balance',\n            // The leading has to come after the size: tailwind-merge counts\n            // font-size as conflicting with line-height and drops the earlier\n            // one, which is how this headline lost its leading entirely.\n            image\n              ? 'text-[clamp(2.5rem,5vw,4.5rem)] leading-[1.02]'\n              : 'text-[clamp(2.5rem,7vw,5.5rem)] leading-[1.0]',\n          )}\n        >\n          {title}\n        </h1>\n        {lede ? (\n          <p className=\"text-[length:var(--text-lede)] text-ink mt-6 max-w-measure leading-[1.7] text-pretty\">\n            {lede}\n          </p>\n        ) : null}\n        {content ? (\n          <div className=\"mt-8 flex flex-wrap items-center gap-6\">{content}</div>\n        ) : null}\n      </div>\n    </div>\n  </section>\n);\n\nexport default Hero;\n"
