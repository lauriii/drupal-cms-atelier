js:
  original: "/**\n * Logo wall — a row of marks.\n *\n * Not a <ul>: Canvas wraps each slot child in its own element, so an <li>\n * would never be a direct child of the list and the parser hoists it out.\n *\n * Not a fixed grid either. A four-column grid holding three marks leaves an\n * empty cell that reads as a missing logo, and the count is an editor's\n * decision. The marks spread across whatever room they have instead, so three\n * and five both look deliberate.\n */\nconst LogoWall = ({ label, content }) => (\n  <div className=\"flex flex-col gap-10\">\n    {label ? <p className=\"text-key text-ink-muted\">{label}</p> : null}\n    <div className=\"flex flex-wrap items-center justify-between gap-x-12 gap-y-10\">\n      {content}\n    </div>\n  </div>\n);\n\nexport default LogoWall;\n"
  compiled: "import { jsxs, jsx } from \"react/jsx-runtime\";\nconst LogoWall = ({ label, content }) => /* @__PURE__ */ jsxs(\"div\", { className: \"flex flex-col gap-10\", children: [\n  label ? /* @__PURE__ */ jsx(\"p\", { className: \"text-key text-ink-muted\", children: label }) : null,\n  /* @__PURE__ */ jsx(\"div\", { className: \"flex flex-wrap items-center justify-between gap-x-12 gap-y-10\", children: content })\n] });\nexport {\n  LogoWall as default\n};\n"
