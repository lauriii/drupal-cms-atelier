langcode: en
status: true
dependencies: {  }
machineName: section_intro
name: 'Section intro'
props:
  eyebrow:
    type: string
    title: Eyebrow
    description: 'A short label above the heading, naming the band.'
    examples:
      - 'What you get'
  title:
    type: string
    title: Title
    examples:
      - 'Components you can actually ship'
  lede:
    type: string
    title: Lede
    description: 'One or two sentences under the heading.'
    examples:
      - 'A small library, built as code, composed by editors.'
  note:
    type: string
    title: Note
    description: 'A short line that hangs in the right-hand columns, on a rule, opposite the heading. Use it for something true about the band — a count, a range of references, a date. Leave it empty and the heading keeps the full width.'
    examples:
      - 'Nos. 04-12'
  align:
    type: string
    enum:
      - left
      - center
    'meta:enum':
      left: Left
      center: Center
    title: Align
    description: 'Left for anything a reader works through; centered for a band that is one statement.'
    examples:
      - left
  level:
    type: string
    enum:
      - h1
      - h2
      - h3
    'meta:enum':
      h1: H1
      h2: H2
      h3: H3
    title: Level
    description: 'Keep headings in order down the page. The band under a page title is usually Heading 2.'
    examples:
      - h2
required:
  - title
  - align
  - level
slots: {  }
js:
  original: "import { cn } from 'drupal-canvas';\n\n/**\n * Section intro — eyebrow, title, lede, and an optional note in the margin.\n *\n * The eyebrow is set the way the title block on a working drawing sets its\n * keys: letterspaced caps at caption size, quiet enough to be a label rather\n * than a heading. The gap to whatever follows belongs to Section, not to this.\n *\n * The note is what stops a band being a narrow column with a wide empty\n * margin. It hangs in the last columns, on the rule, and should carry\n * something true about the band it heads — a count, a range of sheet numbers,\n * a date. It is not a second lede, which is why it is set at caption size.\n */\nconst Intro = ({ eyebrow, title, lede, note, align, level }) => {\n  const Heading = level === 'h1' ? 'h1' : level === 'h3' ? 'h3' : 'h2';\n  const centered = align === 'center';\n\n  const block = (\n    <>\n      {eyebrow ? <p className=\"text-key text-ink-muted\">{eyebrow}</p> : null}\n      <Heading\n        className={cn(\n          'font-display tracking-display font-light text-balance',\n          eyebrow ? 'mt-4' : '',\n          level === 'h1'\n            ? 'text-[clamp(2.75rem,6vw,4.5rem)] leading-[1.02]'\n            : 'text-[clamp(2.25rem,4.6vw,3.5rem)] leading-[1.05]',\n        )}\n      >\n        {title}\n      </Heading>\n      {lede ? (\n        <p className=\"text-[length:var(--text-body)] text-ink mt-6 leading-[1.7] text-pretty\">\n          {lede}\n        </p>\n      ) : null}\n    </>\n  );\n\n  if (note && !centered) {\n    return (\n      <header className=\"md:grid md:grid-cols-12 md:gap-x-12\">\n        <div className=\"max-w-intro md:col-span-7\">{block}</div>\n        <p className=\"text-[length:var(--text-caption)] text-ink-muted border-hairline mt-10 border-t pt-4 md:col-span-3 md:col-start-10 md:mt-0\">\n          {note}\n        </p>\n      </header>\n    );\n  }\n\n  return (\n    <header className={cn('max-w-intro', centered && 'mx-auto text-center')}>\n      {block}\n    </header>\n  );\n};\n\nexport default Intro;\n"
  compiled: "import { jsxs, Fragment, jsx } from \"react/jsx-runtime\";\nimport { cn } from \"drupal-canvas\";\nconst Intro = ({ eyebrow, title, lede, note, align, level }) => {\n  const Heading = level === \"h1\" ? \"h1\" : level === \"h3\" ? \"h3\" : \"h2\";\n  const centered = align === \"center\";\n  const block = /* @__PURE__ */ jsxs(Fragment, { children: [\n    eyebrow ? /* @__PURE__ */ jsx(\"p\", { className: \"text-key text-ink-muted\", children: eyebrow }) : null,\n    /* @__PURE__ */ jsx(\n      Heading,\n      {\n        className: cn(\n          \"font-display tracking-display font-light text-balance\",\n          eyebrow ? \"mt-4\" : \"\",\n          level === \"h1\" ? \"text-[clamp(2.75rem,6vw,4.5rem)] leading-[1.02]\" : \"text-[clamp(2.25rem,4.6vw,3.5rem)] leading-[1.05]\"\n        ),\n        children: title\n      }\n    ),\n    lede ? /* @__PURE__ */ jsx(\"p\", { className: \"text-[length:var(--text-body)] text-ink mt-6 leading-[1.7] text-pretty\", children: lede }) : null\n  ] });\n  if (note && !centered) {\n    return /* @__PURE__ */ jsxs(\"header\", { className: \"md:grid md:grid-cols-12 md:gap-x-12\", children: [\n      /* @__PURE__ */ jsx(\"div\", { className: \"max-w-intro md:col-span-7\", children: block }),\n      /* @__PURE__ */ jsx(\"p\", { className: \"text-[length:var(--text-caption)] text-ink-muted border-hairline mt-10 border-t pt-4 md:col-span-3 md:col-start-10 md:mt-0\", children: note })\n    ] });\n  }\n  return /* @__PURE__ */ jsx(\"header\", { className: cn(\"max-w-intro\", centered && \"mx-auto text-center\"), children: block });\n};\nexport {\n  Intro as default\n};\n"
