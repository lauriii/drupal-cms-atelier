langcode: en
status: true
dependencies: {  }
machineName: testimonial
name: Testimonial
props:
  quote:
    type: string
    title: Quote
    description: 'Their words, without the quotation marks. Those are added for you, in the language of the page.'
    examples:
      - 'Our editors stopped filing tickets for layout changes.'
  name:
    type: string
    title: Name
    examples:
      - 'Marta Oyelaran'
  role:
    type: string
    title: Role
    description: 'What they had made, or what they do. Keep the format the same across the site.'
    examples:
      - 'Digital lead, Northwind'
  avatar:
    type: object
    $ref: 'json-schema-definitions://canvas.module/image'
    title: Avatar
    description: 'Optional. A portrait works; a logo usually does not.'
    examples:
      -
        src: 'https://placehold.co/160x160@2x.png?alternateWidths=https%3A%2F%2Fplacehold.co%2F%7Bwidth%7Dx%7Bheight%7D%402x.png'
        alt: 'Example image placeholder'
        width: 160
        height: 160
required:
  - quote
  - name
slots: {  }
