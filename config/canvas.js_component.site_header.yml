js:
  original: "/** Site header — wordmark and navigation, on a hairline. */\nconst SiteHeader = ({ wordmark, content }) => (\n  <header className=\"border-b border-hairline bg-paper\">\n    {/*\n      Wraps rather than collapsing behind a toggle: the menu here is short\n      enough that a second row costs less than a button nobody asked for.\n    */}\n    <div className=\"mx-auto flex max-w-[82rem] flex-wrap items-center justify-between gap-x-8 gap-y-4 px-6 py-6 md:px-10 md:py-7\">\n      <a\n        href=\"/\"\n        className=\"font-display text-[1.5rem] font-light tracking-tight\"\n      >\n        {wordmark}\n      </a>\n      <div className=\"flex flex-wrap items-center gap-x-8 gap-y-3\">\n        {content}\n      </div>\n    </div>\n  </header>\n);\n\nexport default SiteHeader;\n"
