js:
  original: "/**\n * Site header — wordmark and navigation, on a hairline.\n *\n * A div, not a <header>: the theme region this renders into is already the\n * page's banner landmark, and nesting a second one gives assistive technology\n * two unnamed banners per page.\n */\nconst SiteHeader = ({ wordmark, content }) => (\n  <div className=\"border-b border-hairline bg-paper\">\n    {/*\n      One row wherever it fits, and the type steps down to keep it that way\n      to 390px. Below that — or once an editor adds a fifth menu item — it\n      wraps rather than pushing the page sideways, because a horizontal scroll\n      is worse than a second row.\n    */}\n    <div className=\"mx-auto flex max-w-page flex-wrap items-center justify-between gap-x-3 gap-y-3 px-6 py-5 sm:gap-x-4 md:gap-x-8 md:px-10 md:py-7\">\n      <a\n        href=\"/\"\n        className=\"font-display tracking-display shrink-0 text-[1.25rem] font-normal sm:text-[1.375rem] md:text-[1.5rem]\"\n      >\n        {wordmark}\n      </a>\n      <div className=\"flex flex-wrap items-center gap-x-4 gap-y-2 md:gap-x-8\">\n        {content}\n      </div>\n    </div>\n  </div>\n);\n\nexport default SiteHeader;\n"
  compiled: "import { jsx, jsxs } from \"react/jsx-runtime\";\nconst SiteHeader = ({ wordmark, content }) => /* @__PURE__ */ jsx(\"div\", { className: \"border-b border-hairline bg-paper\", children: /* @__PURE__ */ jsxs(\"div\", { className: \"mx-auto flex max-w-page flex-wrap items-center justify-between gap-x-3 gap-y-3 px-6 py-5 sm:gap-x-4 md:gap-x-8 md:px-10 md:py-7\", children: [\n  /* @__PURE__ */ jsx(\n    \"a\",\n    {\n      href: \"/\",\n      className: \"font-display tracking-display shrink-0 text-[1.25rem] font-normal sm:text-[1.375rem] md:text-[1.5rem]\",\n      children: wordmark\n    }\n  ),\n  /* @__PURE__ */ jsx(\"div\", { className: \"flex flex-wrap items-center gap-x-4 gap-y-2 md:gap-x-8\", children: content })\n] }) });\nexport {\n  SiteHeader as default\n};\n"
