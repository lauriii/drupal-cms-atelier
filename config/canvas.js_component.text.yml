js:
  original: "import { cva } from 'class-variance-authority';\nimport { cn, FormattedText } from 'drupal-canvas';\n\nconst textVariants = cva('my-8', {\n  variants: {\n    textColor: {\n      dark: '!text-black',\n      light: '!text-white',\n    },\n    textSize: {\n      extra_small: 'text-xs',\n      small: 'text-sm',\n      normal: 'text-base/6',\n      large: 'text-lg/8',\n      extra_large: 'text-xl/8',\n    },\n    textShadow: {\n      light: 'text-shadow-sm',\n      medium: 'text-shadow-md',\n      heavy: 'text-shadow-lg',\n    },\n  },\n});\n\nconst Text = ({ text, textSize, textColor, textShadow, className }) => {\n  return (\n    <FormattedText\n      className={cn(\n        textVariants({ textColor, textSize, textShadow }),\n        className,\n      )}\n    >\n      {text}\n    </FormattedText>\n  );\n};\n\nexport default Text;\n"
  compiled: "import { jsx } from \"react/jsx-runtime\";\nimport { cva } from \"class-variance-authority\";\nimport { FormattedText, cn } from \"drupal-canvas\";\nconst textVariants = cva(\"my-8\", {\n  variants: {\n    textColor: {\n      dark: \"!text-black\",\n      light: \"!text-white\"\n    },\n    textSize: {\n      extra_small: \"text-xs\",\n      small: \"text-sm\",\n      normal: \"text-base/6\",\n      large: \"text-lg/8\",\n      extra_large: \"text-xl/8\"\n    },\n    textShadow: {\n      light: \"text-shadow-sm\",\n      medium: \"text-shadow-md\",\n      heavy: \"text-shadow-lg\"\n    }\n  }\n});\nconst Text = ({ text, textSize, textColor, textShadow, className }) => {\n  return /* @__PURE__ */ jsx(\n    FormattedText,\n    {\n      className: cn(\n        textVariants({ textColor, textSize, textShadow }),\n        className\n      ),\n      children: text\n    }\n  );\n};\nexport {\n  Text as default\n};\n"
