langcode: en
status: true
dependencies: {  }
machineName: feature
name: Feature
props:
  marker:
    type: string
    title: Marker
    description: 'An optional number or letter before the title. Use it only when the items are a real sequence.'
    examples:
      - Authoring
  title:
    type: string
    title: Title
    examples:
      - 'Write components in your editor'
  text:
    type: string
    contentMediaType: text/html
    x-formatting-context: block
    title: Text
    examples:
      - '<p>React files with Tailwind, previewed locally.</p>'
  framed:
    type: boolean
    title: Framed
    description: 'Draws a rule above the item, so a row of them reads as one set.'
    examples:
      - true
  level:
    type: string
    enum:
      - h2
      - h3
      - h4
    'meta:enum':
      h2: 'Heading 2'
      h3: 'Heading 3'
      h4: 'Heading 4'
    title: Level
    description: 'Keep headings in order down the page: one level below the heading of the band this sits in.'
    examples:
      - h3
required:
  - title
  - framed
slots: {  }
js:
  original: "import { cn, FormattedText } from 'drupal-canvas';\n\n/** Feature — one idea, stated plainly. */\nconst Feature = ({ title, text, marker, framed, level }) => {\n  const Heading = level === 'h2' ? 'h2' : level === 'h4' ? 'h4' : 'h3';\n  return (\n    <article\n      className={cn('flex flex-col', framed && 'border-t border-hairline pt-7')}\n    >\n      {marker ? (\n        <p className=\"text-key text-ink-muted mb-4\">\n          {marker}\n        </p>\n      ) : null}\n      <Heading className=\"font-display text-[length:var(--text-subhead)] leading-snug font-normal\">\n        {title}\n      </Heading>\n      {text ? (\n        <div className=\"text-[length:var(--text-body)] text-ink mt-4 leading-[1.7] [&_a]:underline [&_a]:underline-offset-4 [&_a:hover]:text-ink-muted\">\n          <FormattedText>{text}</FormattedText>\n        </div>\n      ) : null}\n    </article>\n  );\n};\n\nexport default Feature;\n"
  compiled: "import { jsxs, jsx } from \"react/jsx-runtime\";\nimport { FormattedText, cn } from \"drupal-canvas\";\nconst Feature = ({ title, text, marker, framed, level }) => {\n  const Heading = level === \"h2\" ? \"h2\" : level === \"h4\" ? \"h4\" : \"h3\";\n  return /* @__PURE__ */ jsxs(\n    \"article\",\n    {\n      className: cn(\"flex flex-col\", framed && \"border-t border-hairline pt-7\"),\n      children: [\n        marker ? /* @__PURE__ */ jsx(\"p\", { className: \"text-key text-ink-muted mb-4\", children: marker }) : null,\n        /* @__PURE__ */ jsx(Heading, { className: \"font-display text-[length:var(--text-subhead)] leading-snug font-normal\", children: title }),\n        text ? /* @__PURE__ */ jsx(\"div\", { className: \"text-[length:var(--text-body)] text-ink mt-4 leading-[1.7] [&_a]:underline [&_a]:underline-offset-4 [&_a:hover]:text-ink-muted\", children: /* @__PURE__ */ jsx(FormattedText, { children: text }) }) : null\n      ]\n    }\n  );\n};\nexport {\n  Feature as default\n};\n"
css:
  original: ''
  compiled: ''
dataDependencies: {  }
