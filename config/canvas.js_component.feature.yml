  original: "import { cn } from 'drupal-canvas';\nimport { FormattedText } from 'drupal-canvas';\n\n/** Feature — one idea, stated plainly. */\nconst Feature = ({ title, text, marker, framed }) => (\n  <article\n    className={cn('flex flex-col', framed && 'border-t border-hairline pt-7')}\n  >\n    {marker ? (\n      <p className=\"font-display text-[1.375rem] font-light text-ink-muted\">\n        {marker}\n      </p>\n    ) : null}\n    <h3 className=\"font-display mt-3 text-[1.5rem] font-light leading-snug\">\n      {title}\n    </h3>\n    {text ? (\n      <div className=\"mt-4 text-[1.0625rem] leading-[1.7] text-ink-muted\">\n        <FormattedText>{text}</FormattedText>\n      </div>\n    ) : null}\n  </article>\n);\n\nexport default Feature;\n"
