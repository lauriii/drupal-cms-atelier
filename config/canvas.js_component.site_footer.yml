js:
  original: "/**\n * Site footer — wordmark, a line of credit, and whatever is slotted in.\n *\n * A div for the same reason as the header: the region already supplies the\n * contentinfo landmark.\n */\nconst SiteFooter = ({ wordmark, note, content }) => (\n  <div className=\"border-t border-hairline bg-paper\">\n    <div className=\"mx-auto flex max-w-page flex-col gap-8 px-6 py-12 md:flex-row md:items-center md:justify-between md:px-10\">\n      <div>\n        <p className=\"font-display tracking-display text-[length:var(--text-title)] font-normal\">\n          {wordmark}\n        </p>\n        {note ? (\n          <p className=\"text-[length:var(--text-caption)] text-ink-muted mt-2\">{note}</p>\n        ) : null}\n      </div>\n      {content ? (\n        <div className=\"flex flex-wrap items-center gap-x-7 gap-y-3\">\n          {content}\n        </div>\n      ) : null}\n    </div>\n  </div>\n);\n\nexport default SiteFooter;\n"
