langcode: en
status: true
dependencies: {  }
machineName: figure
name: Figure
props:
  image:
    type: object
    $ref: 'json-schema-definitions://canvas.module/image'
    title: Image
    examples:
      -
        src: 'https://placehold.co/1000x1250@2x.png?alternateWidths=https%3A%2F%2Fplacehold.co%2F%7Bwidth%7Dx%7Bheight%7D%402x.png'
        alt: 'Example image placeholder'
        width: 1000
        height: 1250
  title:
    type: string
    title: Title
    examples:
      - 'Bench No. 4'
  caption:
    type: string
    title: Caption
    description: 'What the piece is: timber, size, where it went.'
    examples:
      - 'Solid ash, oiled'
  url:
    type: string
    format: uri-reference
    title: URL
    description: 'Links the title to a page about this piece. Leave empty for a plain caption.'
  sheet:
    type: string
    title: Sheet
    description: 'A piece or catalogue reference, set in a ruled box above the title. Leave empty for a plain caption.'
    examples:
      - 'No. 04'
  ratio:
    type: string
    enum:
      - natural
      - tall
      - wide
    'meta:enum':
      natural: 'As shot'
      tall: 'Tall (6:7)'
      wide: 'Wide (16:9)'
    title: Ratio
    description: 'Crops the image to a fixed shape. Use the same one for every figure in a row so their captions line up; leave it as shot for a figure standing on its own.'
    examples:
      - natural
  availability:
    type: string
    title: Availability
    description: 'A short note under the caption, such as "Not yet for sale" or "Made to order". Leave empty when the piece is simply available.'
    examples:
      - 'Made to order'
  level:
    type: string
    enum:
      - h2
      - h3
      - h4
    'meta:enum':
      h2: 'Heading 2'
      h3: 'Heading 3'
      h4: 'Heading 4'
    title: Level
    description: 'Keep headings in order down the page: one level below the heading of the band this sits in.'
    examples:
      - h3
required:
  - image
slots: {  }
js:
  original: "import { cn, Image } from 'drupal-canvas';\n\n/**\n * Figure — a drawing with its caption, set the way a drawing is labelled: the\n * title bound tight to the caption, and the pair held away from the image.\n */\nconst Figure = ({ image, title, caption, url, level, sheet, ratio, availability }) => {\n  const Heading = level === 'h2' ? 'h2' : level === 'h4' ? 'h4' : 'h3';\n  return (\n    <figure className=\"group flex flex-col\">\n      {image ? (\n        <Image\n          {...image}\n          sizes=\"(min-width: 1024px) 40vw, (min-width: 640px) 50vw, 100vw\"\n          className={cn(\n            'mb-6 w-full',\n            // A row of figures needs one ratio, or a differently-proportioned\n            // source raggeds the line the captions hang from. A figure standing\n            // on its own should keep the shape it was shot in.\n            ratio === 'tall' && 'aspect-[6/7] object-cover',\n            ratio === 'wide' && 'aspect-[16/9] object-cover',\n            // The link is on the title, so the image dims with it rather\n            // than carrying the accessible name on its own.\n            url && 'transition-opacity duration-150 group-hover:opacity-85',\n          )}\n        />\n      ) : null}\n      {title || caption || sheet || availability ? (\n        <figcaption className=\"border-t border-hairline pt-3\">\n          {sheet ? (\n            <p className=\"key-label text-ink-muted border-accent mb-2 inline-block border px-2 py-0.5\">\n              {sheet}\n            </p>\n          ) : null}\n          {title ? (\n            <Heading className=\"text-[length:var(--text-title)] leading-snug font-medium\">\n              {url ? (\n                <a\n                  href={url}\n                  className=\"underline decoration-ink/40 underline-offset-4 hover:decoration-ink\"\n                >\n                  {title}\n                </a>\n              ) : (\n                title\n              )}\n            </Heading>\n          ) : null}\n          {caption ? (\n            <p className=\"text-[length:var(--text-caption)] text-ink-muted mt-1.5 max-w-measure\">{caption}</p>\n          ) : null}\n          {availability ? (\n            // Plain, not boxed: the ruled box belongs to the sheet number, and\n            // a second tenant in it stops it meaning \"catalogue plate\".\n            <p className=\"key-label text-ink-muted mt-3\">{availability}</p>\n          ) : null}\n        </figcaption>\n      ) : null}\n    </figure>\n  );\n};\n\nexport default Figure;\n"
