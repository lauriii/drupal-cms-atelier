js:
  original: "import { Image } from 'drupal-canvas';\n\n/**\n * Logo — a single mark.\n *\n * The marks ship as monochrome artwork on transparency, normalised to one cap\n * height so `object-contain` renders them at comparable optical size rather\n * than at whatever size each file happens to sit on its canvas.\n *\n * Ink is baked into the pixels, so a mark cannot follow the tokens the way text\n * does. It inverts instead when it finds itself on an inverted ground, which\n * keeps the logo wall usable in a `wash` or `ink` band rather than only on\n * paper. @see global.css\n */\nconst Logo = ({ image, url }) => {\n  const mark = (\n    <Image\n      {...image}\n      sizes=\"(min-width: 640px) 22vw, 45vw\"\n      className=\"h-14 w-full object-contain opacity-80 transition-opacity duration-150 hover:opacity-100 [[data-scheme='ink']_&]:invert\"\n    />\n  );\n  return <div className=\"w-full\">{url ? <a href={url}>{mark}</a> : mark}</div>;\n};\n\nexport default Logo;\n"
