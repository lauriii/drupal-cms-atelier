langcode: en
status: true
dependencies: {  }
machineName: site_nav
name: 'Site navigation'
props:
  menu:
    type: string
    title: Menu
    description: 'The machine name of a Drupal menu, as listed at Administration > Menus. Case-sensitive; defaults to the main menu.'
    examples:
      - main
  label:
    type: string
    title: Label
    description: 'Names this navigation for screen readers, so a page with more than one menu can be told apart. Defaults to "Main".'
    examples:
      - Main
required: {  }
slots: {  }
js:
  original: "import { JsonApiClient, sortMenu } from 'drupal-canvas';\nimport useSWR from 'swr';\n\nconst client = new JsonApiClient();\n\n/**\n * Site navigation — reads a Drupal menu over JSON:API.\n *\n * This is the part a static component library cannot do: editors manage the\n * menu in Drupal and the front end follows, with no rebuild.\n */\nconst SiteNav = ({ menu, label }) => {\n  const name = menu || 'main';\n  const { data, error, isLoading } = useSWR(['menu_items', name], ([type, id]) =>\n    client.getResource(type, id),\n  );\n  const links = !error && !isLoading && data ? sortMenu(data) : [];\n\n  if (error) {\n    return (\n      <p className=\"text-[length:var(--text-caption)] text-ink-muted\">\n        Menu unavailable\n      </p>\n    );\n  }\n\n  if (!links.length) {\n    return null;\n  }\n\n  return (\n    // Rendered even while the fetch is in flight, and kept at the height of a\n    // row of links, so the header does not reflow under the reader when the\n    // menu arrives — or collapse silently if the request fails.\n    <nav aria-label={label || 'Main'} className=\"min-h-6\">\n      <ul className=\"flex flex-wrap items-center gap-x-4 gap-y-2 md:gap-x-7\">\n        {links.map(({ id, title, url }) => (\n          <li key={id}>\n            <a\n              href={url}\n              className=\"text-ink-muted hover:text-ink text-[0.875rem] transition-colors duration-150 md:text-[1rem]\"\n            >\n              {title}\n            </a>\n          </li>\n        ))}\n      </ul>\n    </nav>\n  );\n};\n\nexport default SiteNav;\n"
  compiled: "import { jsx } from \"react/jsx-runtime\";\nimport { JsonApiClient, sortMenu } from \"drupal-canvas\";\nimport useSWR from \"swr\";\nconst client = new JsonApiClient();\nconst SiteNav = ({ menu, label }) => {\n  const name = menu || \"main\";\n  const { data, error, isLoading } = useSWR(\n    [\"menu_items\", name],\n    ([type, id]) => client.getResource(type, id)\n  );\n  const links = !error && !isLoading && data ? sortMenu(data) : [];\n  if (error) {\n    return /* @__PURE__ */ jsx(\"p\", { className: \"text-[length:var(--text-caption)] text-ink-muted\", children: \"Menu unavailable\" });\n  }\n  if (!links.length) {\n    return null;\n  }\n  return (\n    // Rendered even while the fetch is in flight, and kept at the height of a\n    // row of links, so the header does not reflow under the reader when the\n    // menu arrives — or collapse silently if the request fails.\n    /* @__PURE__ */ jsx(\"nav\", { \"aria-label\": label || \"Main\", className: \"min-h-6\", children: /* @__PURE__ */ jsx(\"ul\", { className: \"flex flex-wrap items-center gap-x-4 gap-y-2 md:gap-x-7\", children: links.map(({ id, title, url }) => /* @__PURE__ */ jsx(\"li\", { children: /* @__PURE__ */ jsx(\n      \"a\",\n      {\n        href: url,\n        className: \"text-ink-muted hover:text-ink text-[0.875rem] transition-colors duration-150 md:text-[1rem]\",\n        children: title\n      }\n    ) }, id)) }) })\n  );\n};\nexport {\n  SiteNav as default\n};\n"
