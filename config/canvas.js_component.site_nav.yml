machineName: site_nav
name: 'Site navigation'
props:
  menu:
    type: string
    title: Menu
    description: 'Machine name of the Drupal menu to render.'
    examples:
      - main
required: {  }
slots: {  }
js:
  original: "import { JsonApiClient, sortMenu } from 'drupal-canvas';\nimport useSWR from 'swr';\n\nconst client = new JsonApiClient();\n\n/**\n * Site navigation — reads a Drupal menu over JSON:API.\n *\n * This is the part a static component library cannot do: editors manage the\n * menu in Drupal and the front end follows, with no rebuild.\n */\nconst SiteNav = ({ menu }) => {\n  const name = menu || 'main';\n  const { data, error, isLoading } = useSWR(['menu_items', name], ([type, id]) =>\n    client.getResource(type, id),\n  );\n  const links = !error && !isLoading && data ? Array.from(sortMenu(data)) : [];\n\n  if (!links.length) {\n    return null;\n  }\n  return (\n    <nav aria-label=\"Main\">\n      <ul className=\"flex items-center gap-7\">\n        {links.map(({ id, title, url }) => (\n          <li key={id}>\n            <a\n              href={url}\n              className=\"text-[1rem] text-ink-muted transition-colors duration-150 hover:text-ink\"\n            >\n              {title}\n            </a>\n          </li>\n        ))}\n      </ul>\n    </nav>\n  );\n};\n\nexport default SiteNav;\n"
  compiled: "import { jsx } from \"react/jsx-runtime\";\nimport { JsonApiClient, sortMenu } from \"drupal-canvas\";\nimport useSWR from \"swr\";\nconst client = new JsonApiClient();\nconst SiteNav = ({ menu }) => {\n  const name = menu || \"main\";\n  const { data, error, isLoading } = useSWR(\n    [\"menu_items\", name],\n    ([type, id]) => client.getResource(type, id)\n  );\n  const links = !error && !isLoading && data ? Array.from(sortMenu(data)) : [];\n  if (!links.length) {\n    return null;\n  }\n  return /* @__PURE__ */ jsx(\"nav\", { \"aria-label\": \"Main\", children: /* @__PURE__ */ jsx(\"ul\", { className: \"flex items-center gap-7\", children: links.map(({ id, title, url }) => /* @__PURE__ */ jsx(\"li\", { children: /* @__PURE__ */ jsx(\n    \"a\",\n    {\n      href: url,\n      className: \"text-[1rem] text-ink-muted transition-colors duration-150 hover:text-ink\",\n      children: title\n    }\n  ) }, id)) }) });\n};\nexport {\n  SiteNav as default\n};\n"
