langcode: en
status: true
dependencies: {  }
machineName: site_nav
name: 'Site navigation'
props:
  menu:
    type: string
    title: Menu
    description: 'The machine name of a Drupal menu, as listed at Administration > Menus. Case-sensitive; defaults to the main menu.'
    examples:
      - main
  label:
    type: string
    title: Label
    description: 'Names this navigation for screen readers, so a page with more than one menu can be told apart. Defaults to "Main".'
    examples:
      - Main
required: {  }
slots: {  }
js:
  original: "import { JsonApiClient, sortMenu } from 'drupal-canvas';\nimport useSWR from 'swr';\n\nconst client = new JsonApiClient();\n\n/**\n * Site navigation — reads a Drupal menu over JSON:API.\n *\n * This is the part a static component library cannot do: editors manage the\n * menu in Drupal and the front end follows, with no rebuild. That only holds\n * if the front end follows everything, so a second level renders rather than\n * being dropped on the floor.\n */\nconst SiteNav = ({ menu, label }) => {\n  const name = menu || 'main';\n  const { data, error, isLoading } = useSWR(['menu_items', name], ([type, id]) =>\n    client.getResource(type, id),\n  );\n  const links = !error && !isLoading && data ? sortMenu(data) : [];\n  const here =\n    typeof window === 'undefined' ? null : window.location.pathname;\n\n  if (error) {\n    return (\n      <p className=\"text-[length:var(--text-caption)] text-ink-muted\">\n        Menu unavailable\n      </p>\n    );\n  }\n  // Loaded and empty is not the same as still loading: an empty labelled\n  // landmark on every page is worse than no landmark.\n  if (!isLoading && !links.length) {\n    return null;\n  }\n\n  const link = ({ id, title, url, _children }) => (\n    <li key={id} className=\"nav-item\">\n      <a\n        href={url}\n        aria-current={url === here ? 'page' : undefined}\n        className=\"text-ink-muted hover:text-ink aria-[current=page]:text-accent inline-flex min-h-6 items-center py-1.5 text-[length:var(--text-caption)] transition-colors duration-150 md:text-[length:var(--text-ui)]\"\n      >\n        {title}\n      </a>\n      {_children?.length ? (\n        <ul className=\"nav-submenu\">\n          {_children.map((child) => (\n            <li key={child.id}>\n              <a\n                href={child.url}\n                aria-current={child.url === here ? 'page' : undefined}\n                className=\"text-ink-muted hover:text-ink aria-[current=page]:text-accent block whitespace-nowrap text-[length:var(--text-caption)] transition-colors duration-150\"\n              >\n                {child.title}\n              </a>\n            </li>\n          ))}\n        </ul>\n      ) : null}\n    </li>\n  );\n\n  return (\n    // Rendered even while the fetch is in flight, and kept at the height of a\n    // row of links, so the header does not reflow under the reader when the\n    // menu arrives.\n    <nav aria-label={label || 'Main'} className=\"min-h-6\">\n      {/*\n        A phone got the whole sitemap laid flat across five rows before any\n        content. This folds it behind a toggle built on <details>, which knows\n        how to open on Enter and Space and announces its own expanded state, so\n        the menu needs no script and works before the island hydrates. Above\n        the header breakpoint the toggle is hidden and the list is forced back\n        open, which is why the CSS lives in global.css rather than in a\n        variant here.\n      */}\n      {/*\n        A menu of one or two items has nothing to collapse, and folding it\n        anyway put the footer's only link behind a control labelled \"Menu\"\n        inside a landmark called \"Footer\". Short menus stay open.\n      */}\n      {links.length > 2 ? (\n        <details className=\"nav-disclosure\">\n          <summary className=\"nav-toggle key-label text-ink\">Menu</summary>\n          <ul className=\"nav-list\">{links.map(link)}</ul>\n        </details>\n      ) : (\n        <ul className=\"nav-list nav-list--open\">{links.map(link)}</ul>\n      )}\n    </nav>\n  );\n};\n\nexport default SiteNav;\n"
