      50-50: 50-50
      33-33-33: 33-33-33
      50-25-25: 50-25-25
      25-25-50: 25-25-50
      25-25-25-25: 25-25-25-25
    title: Layout
    examples:
      - 33-33-33
required:
  - layout
  - textColor
slots:
  content:
    title: Content
js:
  original: "import GridContainer from '@/components/grid_container';\nimport Heading from '@/components/heading';\nimport { cn } from 'drupal-canvas';\n\nconst ThreeColumnCardContainer = ({\n  className,\n  headingPosition,\n  heading,\n  headingElement,\n  headingSize = 'large',\n  preHeading,\n  textColor,\n  layout,\n  content,\n}) => {\n  return (\n    <div className={cn('mx-6 flex flex-col items-center gap-16', className)}>\n      {heading ? (\n        <Heading\n          heading={heading}\n          headingElement={headingElement}\n          headingSize={headingSize}\n          layout={headingPosition}\n          preHeading={preHeading}\n          textColor={textColor}\n        />\n      ) : null}\n      <GridContainer content={content} layout={layout} />\n    </div>\n  );\n};\n\nexport default ThreeColumnCardContainer;\n"
  compiled: "import { jsxs, jsx } from \"react/jsx-runtime\";\nimport GridContainer from \"@/components/grid_container\";\nimport Heading from \"@/components/heading\";\nimport { cn } from \"drupal-canvas\";\nconst ThreeColumnCardContainer = ({\n  className,\n  headingPosition,\n  heading,\n  headingElement,\n  headingSize = \"large\",\n  preHeading,\n  textColor,\n  layout,\n  content\n}) => {\n  return /* @__PURE__ */ jsxs(\"div\", { className: cn(\"mx-6 flex flex-col items-center gap-16\", className), children: [\n    heading ? /* @__PURE__ */ jsx(\n      Heading,\n      {\n        heading,\n        headingElement,\n        headingSize,\n        layout: headingPosition,\n        preHeading,\n        textColor\n      }\n    ) : null,\n    /* @__PURE__ */ jsx(GridContainer, { content, layout })\n  ] });\n};\nexport {\n  ThreeColumnCardContainer as default\n};\n"
