langcode: en
status: true
dependencies:
  enforced:
    config:
      - canvas.js_component.grid_container
      - canvas.js_component.heading
machineName: card_container
name: 'Card Container'
props:
  preHeading:
    type: string
    title: 'Pre Heading'
    examples:
      - 'Featured services'
  heading:
    type: string
    title: Heading
    examples:
      - 'What we offer.'
  headingSize:
    type: string
    enum:
      - extra_large
      - large
      - medium
      - small
    'meta:enum':
      extra_large: 'Extra Large'
      large: Large
      medium: Medium
      small: Small
