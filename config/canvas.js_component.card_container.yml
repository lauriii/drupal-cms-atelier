      - large
  textColor:
    type: string
    enum:
      - dark
      - light
    'meta:enum':
      dark: Dark
      light: Light
    title: 'Text Color'
    examples:
      - dark
  headingPosition:
    type: string
    enum:
      - left_aligned
      - center_aligned
      - right_aligned
    'meta:enum':
      left_aligned: 'Left aligned'
      center_aligned: 'Center aligned'
      right_aligned: 'Right aligned'
    title: 'Heading Position'
    examples:
      - center_aligned
  headingElement:
    type: string
    enum:
      - h1
      - h2
      - h3
      - h4
      - h5
      - h6
    'meta:enum':
      h1: h1
      h2: h2
      h3: h3
      h4: h4
      h5: h5
      h6: h6
    title: 'Heading Element'
    examples:
      - h2
  layout:
    type: string
    enum:
      - 50-50
      - 33-33-33
      - 50-25-25
      - 25-25-50
      - 25-25-25-25
