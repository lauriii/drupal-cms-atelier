js:
  original: "import { cn } from 'drupal-canvas';\n\n/** Grid — responsive columns for features, figures, stats and logos. */\nconst Grid = ({ columns, gap, content }) => (\n  <div\n    className={cn(\n      'grid grid-cols-1',\n      columns === '2' && 'sm:grid-cols-2',\n      columns === '3' && 'sm:grid-cols-2 lg:grid-cols-3',\n      columns === '4' && 'grid-cols-2 lg:grid-cols-4',\n      gap === 'sm' ? 'gap-6' : gap === 'lg' ? 'gap-x-12 gap-y-14' : 'gap-8',\n    )}\n  >\n    {content}\n  </div>\n);\n\nexport default Grid;\n"
