machineName: cta
name: 'Call to action'
props:
  level:
    type: string
    enum:
      - h2
      - h3
      - h4
    'meta:enum':
      h2: 'Heading 2'
      h3: 'Heading 3'
      h4: 'Heading 4'
    title: Level
    description: 'The heading level this renders. Pick the one that keeps the page outline in order; it does not change the size.'
