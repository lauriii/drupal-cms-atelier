  original: "import { cn } from 'drupal-canvas';\n\nconst searchParams = new URLSearchParams(window.location.search);\nconst q = searchParams.get('q') || '';\n\nexport default function SearchForm({ className }) {\n  return (\n    <form\n      action=\"/search\"\n      method=\"get\"\n      className={cn('flex gap-2 leading-5', className)}\n    >\n      <div className=\"flex w-full items-center\">\n        <input\n          type=\"search\"\n          name=\"q\"\n          id=\"search_input\"\n          defaultValue={q}\n          placeholder=\"Search...\"\n          className=\"flex-grow rounded-md border-1 border-gray-200 bg-white px-3 py-2\"\n        />\n      </div>\n      <button\n        type=\"submit\"\n        aria-label=\"Search\"\n        className=\"rounded bg-blue-600 p-2.5 leading-0 text-white\"\n      >\n        <svg\n          aria-hidden=\"true\"\n          className=\"h-4 w-4 stroke-white text-white\"\n          width=\"24\"\n          height=\"24\"\n          viewBox=\"0 0 24 24\"\n          fill=\"none\"\n          xmlns=\"http://www.w3.org/2000/svg\"\n        >\n          <path\n            d=\"M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z\"\n            stroke=\"white\"\n            strokeLinecap=\"round\"\n            strokeLinejoin=\"round\"\n          />\n          <path\n            d=\"M21 21L16.7 16.7\"\n            stroke=\"white\"\n            strokeLinecap=\"round\"\n            strokeLinejoin=\"round\"\n          />\n        </svg>\n      </button>\n    </form>\n  );\n}\n"
