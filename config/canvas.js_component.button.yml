      - /about
  variant:
    type: string
    enum:
      - solid
      - secondary
      - outline
      - ghost
      - link
    'meta:enum':
      solid: Solid
      secondary: Secondary
      outline: Outline
      ghost: Ghost
      link: Link
    title: Variant
    examples:
      - solid
  size:
    type: string
    enum:
      - sm
      - md
      - lg
    'meta:enum':
      sm: Small
      md: Medium
      lg: Large
    title: Size
    examples:
      - md
  fullWidth:
    type: boolean
    title: 'Full width'
    examples:
      - false
