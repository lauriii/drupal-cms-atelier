langcode: en
status: true
dependencies: {  }
machineName: section
name: Section
props:
  background:
    type: string
    enum:
      - paper
      - wash
      - ink
    'meta:enum':
      paper: Paper
      wash: Wash
      ink: Ink
    title: Background
    description: 'Paper and wash alternate down a page to separate one band from the next. Ink inverts everything inside it.'
    examples:
      - paper
  spacing:
    type: string
    enum:
      - sm
      - md
      - lg
    'meta:enum':
      sm: Small
      md: Medium
      lg: Large
    title: Spacing
    description: 'How much air the band has above and below it.'
    examples:
      - md
  width:
    type: string
    enum:
      - default
      - full
    'meta:enum':
      default: 'Page rail'
      full: 'Full width'
    title: Width
    description: 'The page rail keeps this band on the same left edge as every other one. Full width escapes it, for imagery that should reach the screen edge.'
    examples:
      - default
  divider:
    type: boolean
    title: Divider
    description: 'Draws a hairline rule along the top of the band.'
    examples:
      - false
required:
  - background
  - spacing
  - width
slots:
  content:
    title: Content
js:
  original: "import { cva } from 'class-variance-authority';\nimport { cn } from 'drupal-canvas';\n\n/**\n * Section — the vertical rhythm of the whole site.\n *\n * Every band on a page is a Section, and Section owns two gaps: the padding\n * above and below the band, and the gap between the components stacked inside\n * it. Both come from tokens rather than per-instance values, which is what\n * keeps an editor-composed page looking designed.\n *\n * The container is the page rail, and there is deliberately no narrow or wide\n * step: a band that moves the left edge makes a reader re-find it on every\n * scroll. Narrower measures are the job of the text block inside. `full`\n * escapes the rail entirely, for imagery that should reach the screen edge.\n */\nconst section = cva('w-full', {\n  variants: {\n    background: {\n      paper: 'bg-paper text-ink',\n      wash: 'bg-wash text-ink',\n      // The tokens invert under this attribute, so children need no dark-mode\n      // branch of their own. @see global.css\n      ink: 'bg-paper text-ink',\n    },\n    spacing: {\n      // Section padding is a proportion of the screen, not a constant: 8rem\n      // above and below is generous on a desktop and a void on a phone.\n      sm: 'py-[calc(var(--spacing-section-sm)*0.7)] md:py-section-sm',\n      md: 'py-[calc(var(--spacing-section-md)*0.7)] md:py-section-md',\n      lg: 'py-[calc(var(--spacing-section-lg)*0.7)] md:py-section-lg',\n    },\n    divider: { true: 'border-t border-hairline', false: '' },\n  },\n  defaultVariants: { background: 'paper', spacing: 'md', divider: false },\n});\n\nconst Section = ({ background, spacing, divider, width, content }) => (\n  <section\n    className={cn(section({ background, spacing, divider }))}\n    data-scheme={background === 'ink' ? 'ink' : undefined}\n  >\n    <div\n      className={cn(\n        'mx-auto flex flex-col gap-rhythm',\n        width === 'full' ? 'max-w-none px-0' : 'max-w-page px-6 md:px-10',\n      )}\n    >\n      {content}\n    </div>\n  </section>\n);\n\nexport default Section;\n"
  compiled: "import { jsx } from \"react/jsx-runtime\";\nimport { cva } from \"class-variance-authority\";\nimport { cn } from \"drupal-canvas\";\nconst section = cva(\"w-full\", {\n  variants: {\n    background: {\n      paper: \"bg-paper text-ink\",\n      wash: \"bg-wash text-ink\",\n      // The tokens invert under this attribute, so children need no dark-mode\n      // branch of their own. @see global.css\n      ink: \"bg-paper text-ink\"\n    },\n    spacing: {\n      // Section padding is a proportion of the screen, not a constant: 8rem\n      // above and below is generous on a desktop and a void on a phone.\n      sm: \"py-[calc(var(--spacing-section-sm)*0.7)] md:py-section-sm\",\n      md: \"py-[calc(var(--spacing-section-md)*0.7)] md:py-section-md\",\n      lg: \"py-[calc(var(--spacing-section-lg)*0.7)] md:py-section-lg\"\n    },\n    divider: { true: \"border-t border-hairline\", false: \"\" }\n  },\n  defaultVariants: { background: \"paper\", spacing: \"md\", divider: false }\n});\nconst Section = ({ background, spacing, divider, width, content }) => /* @__PURE__ */ jsx(\n  \"section\",\n  {\n    className: cn(section({ background, spacing, divider })),\n    \"data-scheme\": background === \"ink\" ? \"ink\" : void 0,\n    children: /* @__PURE__ */ jsx(\n      \"div\",\n      {\n        className: cn(\n          \"mx-auto flex flex-col gap-rhythm\",\n          width === \"full\" ? \"max-w-none px-0\" : \"max-w-page px-6 md:px-10\"\n        ),\n        children: content\n      }\n    )\n  }\n);\nexport {\n  Section as default\n};\n"
