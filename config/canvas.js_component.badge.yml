js:
  original: "import { cva } from 'class-variance-authority';\nimport { cn } from 'drupal-canvas';\n\n/** Badge — a quiet marker, not a coloured pill. */\nconst badge = cva('inline-flex items-center text-[length:var(--text-caption)]', {\n  variants: {\n    variant: {\n      plain: 'text-ink-muted',\n      // A drawing convention: the label sits in its own ruled box.\n      boxed: 'border border-hairline px-3 py-1 text-ink-muted',\n    },\n  },\n  defaultVariants: { variant: 'plain' },\n});\n\nconst Badge = ({ label, variant }) => (\n  <span className={cn(badge({ variant }))}>{label}</span>\n);\n\nexport default Badge;\n"
