js:
  original: "import { FormattedText } from 'drupal-canvas';\n\n/**\n * Prose — long-form rich text.\n *\n * Styled against the design tokens rather than the Tailwind typography plugin,\n * so editor body copy sits on the same scale and colour as everything the\n * components render, and the template ships one less build dependency.\n */\nconst Prose = ({ text }) => (\n  <div\n    className=\"\n      max-w-[38rem] text-[1.125rem] leading-[1.75] text-ink\n      [&_a]:underline [&_a]:underline-offset-4 [&_a:hover]:text-ink-muted\n      [&_blockquote]:my-8 [&_blockquote]:border-l [&_blockquote]:border-hairline [&_blockquote]:pl-6 [&_blockquote]:text-ink-muted\n      [&_h2]:font-display [&_h2]:mt-14 [&_h2]:mb-4 [&_h2]:text-[1.75rem] [&_h2]:font-normal [&_h2]:leading-[1.2]\n      [&_h3]:font-display [&_h3]:mt-10 [&_h3]:mb-3 [&_h3]:text-[1.3125rem] [&_h3]:font-normal\n      [&_li]:mt-2\n      [&_ol]:mt-6 [&_ol]:list-decimal [&_ol]:pl-6\n      [&_p]:mt-6 [&_p:first-child]:mt-0\n      [&_strong]:font-medium\n      [&_ul]:mt-6 [&_ul]:list-disc [&_ul]:pl-6\n    \"\n  >\n    <FormattedText>{text}</FormattedText>\n  </div>\n);\n\nexport default Prose;\n"
