js:
  original: "import { FormattedText } from 'drupal-canvas';\n\n/**\n * Prose — long-form rich text.\n *\n * Styled against the design tokens rather than the Tailwind typography plugin,\n * so editor body copy sits on the same scale and colour as everything the\n * components render, and the template ships one less build dependency.\n */\nconst Prose = ({ text }) => (\n  <div\n    className=\"\n      max-w-measure text-[length:var(--text-lede)] text-ink leading-[1.75]\n      [&_a]:underline [&_a]:underline-offset-4 [&_a:hover]:text-ink-muted\n      [&_blockquote]:my-8 [&_blockquote]:border-l [&_blockquote]:border-hairline [&_blockquote]:pl-6 [&_blockquote]:text-ink-muted\n      [&_code]:bg-wash [&_code]:px-1.5 [&_code]:py-0.5 [&_code]:text-[0.9em]\n      [&_em]:italic\n      [&_h2]:font-display [&_h2]:mt-14 [&_h2]:mb-4 [&_h2]:text-[1.75rem] [&_h2]:font-normal [&_h2]:leading-[1.2]\n      [&_h3]:font-display [&_h3]:mt-10 [&_h3]:mb-3 [&_h3]:text-[1.3125rem] [&_h3]:font-normal\n      [&_h4]:mt-8 [&_h4]:mb-2 [&_h4]:font-medium\n      [&_hr]:my-12 [&_hr]:border-hairline\n      [&_li]:mt-2\n      [&_ol]:mt-6 [&_ol]:list-decimal [&_ol]:pl-6\n      [&>*:first-child]:mt-0 [&>*>*:first-child]:mt-0\n      [&_p]:mt-6\n      [&_pre]:my-8 [&_pre]:overflow-x-auto [&_pre]:bg-wash [&_pre]:p-4 [&_pre]:text-[0.9375rem]\n      [&_strong]:font-medium\n      [&_table]:my-8 [&_table]:block [&_table]:overflow-x-auto [&_table]:text-[1rem]\n      [&_td]:border-t [&_td]:border-hairline [&_td]:py-2 [&_td]:pr-6\n      [&_th]:border-b [&_th]:border-hairline [&_th]:py-2 [&_th]:pr-6 [&_th]:text-left [&_th]:font-medium\n      [&_ul]:mt-6 [&_ul]:list-disc [&_ul]:pl-6\n    \"\n  >\n    <FormattedText>{text}</FormattedText>\n  </div>\n);\n\nexport default Prose;\n"
