  original: "import { DrupalJsonApiParams } from 'drupal-jsonapi-params';\nimport { JsonApiClient, getNodePath } from 'drupal-canvas';\nimport useSWR from 'swr';\n\nconst client = new JsonApiClient();\n\nconst formatted = (value) =>\n  new Date(value).toLocaleDateString(\n    // The site's language, not the component author's.\n    typeof document === 'undefined'\n      ? undefined\n      : document.documentElement.lang === 'en'\n        ? 'en-GB'\n        : document.documentElement.lang || undefined,\n    { day: 'numeric', month: 'short', year: 'numeric' },\n  );\n\n/**\n * Article teasers — the newest articles, live from Drupal.\n *\n * Editors publish; this updates. No rebuild, no redeploy — the argument for\n * code components that a static library cannot make.\n */\nconst ArticleTeasers = ({ count }) => {\n  const limit = Number(count) || 3;\n  const { data, error, isLoading } = useSWR(\n    ['node--article', limit],\n    ([type, pageLimit]) =>\n      client.getCollection(type, {\n        queryString: new DrupalJsonApiParams()\n          .addFields('node--article', ['title', 'created', 'path', 'drupal_internal__nid'])\n          .addSort('created', 'DESC')\n          .addPageLimit(pageLimit)\n          .getQueryString(),\n      }),\n  );\n\n  // A silent empty render leaves an editor staring at a heading over an empty\n  // band with nothing to explain it. Say which of the three states this is.\n  if (isLoading) {\n    return <p className=\"text-[length:var(--text-caption)] text-ink-muted\">Loading articles…</p>;\n  }\n  if (error) {\n    return (\n      <p className=\"text-[length:var(--text-caption)] text-ink-muted\">\n        Articles could not be loaded.\n      </p>\n    );\n  }\n  if (!data?.length) {\n    return (\n      <p className=\"text-[length:var(--text-caption)] text-ink-muted\">\n        No articles published yet.\n      </p>\n    );\n  }\n  return (\n    <ul className=\"max-w-[58rem] divide-y divide-hairline border-t border-b border-hairline\">\n      {data.map((article) => (\n        <li key={article.id}>\n          <a\n            href={getNodePath(article)}\n            className=\"flex items-baseline justify-between gap-8 py-6 transition-opacity duration-150 hover:opacity-60\"\n          >\n            <span className=\"font-display text-[length:var(--text-title)] leading-snug font-normal\">\n              {article.title}\n            </span>\n            <time\n              dateTime={article.created}\n              className=\"text-[length:var(--text-caption)] text-ink-muted shrink-0\"\n            >\n              {formatted(article.created)}\n            </time>\n          </a>\n        </li>\n      ))}\n    </ul>\n  );\n};\n\nexport default ArticleTeasers;\n"
