langcode: en
status: true
dependencies: {  }
machineName: article_teasers
name: 'Article teasers'
props:
  count:
    type: string
    enum:
      - '3'
      - '5'
      - '8'
    'meta:enum':
      3: Three
      5: Five
      8: Eight
    title: Count
    description: 'How many of the most recent articles to list.'
    examples:
      - '3'
  excerpt:
    type: boolean
    title: Excerpt
    description: 'Adds the first sentence of each article under its title. Use it on an index page, not where the list sits beside other content.'
    examples:
      - false
  level:
    type: string
    enum:
      - h2
      - h3
      - h4
    'meta:enum':
      h2: 'Heading 2'
      h3: 'Heading 3'
      h4: 'Heading 4'
    title: Level
    description: 'The heading level for each article title, so an index page has an outline a screen reader can navigate.'
    examples:
      - h3
required: {  }
slots: {  }
