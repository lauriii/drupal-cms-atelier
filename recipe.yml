name: Nebula
# This key, and only this key, is what makes a recipe selectable as a site
# template in the Drupal CMS installer. It is compared case-sensitively against
# the literal string `Site`; core itself treats `type` as free-form.
# @see \Drupal\drupal_cms_installer\RecipeHandler::scan()
type: Site
description: 'A Drupal CMS site set up as the backend for a Nebula code components codebase. Authoring happens in your editor with React and Tailwind; this template configures the Drupal side that the Canvas CLI pushes to.'

recipes:
  # The Drupal CMS foundation: Gin, the navigation sidebar, dashboards, media
  # types, editorial workflow, SEO and privacy tooling, the `page` content type
  # with its Canvas component tree, the `content_editor` role, and Canvas
  # itself. Everything a Drupal CMS site is expected to have.
  #
  # A site template should be built on this rather than on another site
  # template. Applying it also covers `core/recipes/administrator_role`,
  # `content_editor_role` and the media-type recipes, so this template does not
  # repeat them.
  - drupal_cms_site_template_base
  # Drupal CMS ships a `page` type, not an `article` one. The
  # `related_articles` example component queries `node--article` and reads
  # `field_image`, `uid`, `created`, `title` and `path`, so add it.
  - core/recipes/article_content_type

install:
  # Authentication for the Canvas CLI. The declarative parts live here; the
  # key pair and the consumer secret cannot be shipped in a recipe.
  # @see README.md, "Finish the OAuth setup".
  - canvas_oauth
  - consumers
  - simple_oauth
  # JSON:API, used by code components that read data from this site at runtime.
  - jsonapi
  - jsonapi_resources
  # Exposes /jsonapi/menu_items/{menu}, which the `main_navigation` example
  # component fetches for the `main` menu.
  - jsonapi_menu_items
  # Exposes /jsonapi/index/{index}, which the `search_results` example
  # component queries.
  - jsonapi_search_api
  - search_api
  - search_api_db
  # Content is indexed on cron, so make sure cron runs even without a real
  # cron job.
  - automated_cron
  # A blank shell theme, generated at composer install by
  # `drupal/site_template_helper` from the `extra.drupal-site-template` block
  # in composer.json. It has no templates, no CSS and no SDCs — it renders the
  # Canvas component tree and nothing else, because every pixel of this site's
  # front end comes from the code components you push.
  #
  # Its `header`, `content` and `footer` regions are the targets of the
  # `regions/*.json` files in a Nebula codebase. `content` must be declared:
  # `regions:` replaces the default set wholesale rather than merging with it,
  # and without it main page content and status messages silently disappear.
  # @see \Drupal\Core\Extension\ExtensionList::createExtensionInfo()
  # @see \Drupal\block\Plugin\DisplayVariant\BlockPageVariant::build()
  - nebula_theme

config:
  # Existing configuration wins, so this template can be applied on top of a
  # site that already has some of it.
  strict: false
  import:
    # When a recipe installs a module, core deliberately skips the config
    # *entities* in that module's `config/install`; only simple config is
    # created. Every config entity a module ships has to be imported here.
    # The base recipe already imports `canvas` and `filter`; these are the
    # extensions this template adds on top.
    # @see \Drupal\Core\Recipe\RecipeRunner::installModules()
    #
    # The `canvas:*` OAuth scopes the CLI asks for.
    canvas_oauth: '*'
    # The bundles of the `oauth2_token` entity type. Without these, tokens
    # cannot be stored and every CLI request fails to authenticate.
    simple_oauth: '*'
  actions:
    # The base recipe sets the admin theme to Gin but leaves the front end to
    # the site template, which is this one's job. Gin stays: the shell theme is
    # deliberately unusable for administration.
    system.theme:
      simpleConfigUpdate:
        default: nebula_theme
    # The Canvas landing page shipped in `content/`, same as Drupal CMS's Blank
    # and Starter templates. Dotted, not nested: `simpleConfigUpdate` calls
    # `Config::set()` per key, so a nested `page:` mapping would replace the
    # whole `page` array and wipe the `page.403` the base recipe sets.
    system.site:
      simpleConfigUpdate:
        page.front: /home
    # Code components fetch from JSON:API in the visitor's browser, so
    # anonymous users need read access to content and media.
    user.role.anonymous:
      grantPermissions:
        - 'access content'
        - 'view media'
    user.role.authenticated:
      grantPermissions:
        - 'access content'
        - 'view media'
    # The global CSS the components are styled with — the Tailwind build from
    # the Nebula codebase. It has to be a config action rather than a shipped
    # config file: `canvas.asset_library.global` already exists by the time
    # this recipe's config is imported, because the base recipe creates it when
    # it installs Canvas, and a non-strict recipe only imports config that does
    # not exist yet.
    # @see \Drupal\Core\Recipe\ConfigConfigurator::getConfigStorage()
    # BEGIN generated: global CSS. @see tests/regenerate-components.sh
    canvas.asset_library.global:
      setProperties:
        label: 'Global CSS'
        css:
          original: "/*\n * Ensure your theme imports the font you're using in this file.\n * Alternatively, you can load fonts purely in Code Components by importing a\n * CSS file with the font declarations from a URL, i.e. a CDN. For example, you\n * can uncomment the following line to use the Inter font.\n * For local development, Workbench loads the global CSS file configured in\n * canvas.config.json.\n */\n/* @import url(\"https://rsms.me/inter/inter.css\"); */\n\n@import 'tailwindcss';\n\n@theme {\n  --font-sans:\n    Inter, Roboto, 'Helvetica Neue', 'Arial Nova', 'Nimbus Sans', Arial,\n    sans-serif;\n\n  --color-primary-100: var(--color-blue-100);\n  --color-primary-200: var(--color-blue-200);\n  --color-primary-300: var(--color-blue-300);\n  --color-primary-400: var(--color-blue-400);\n  --color-primary-500: var(--color-blue-500);\n  --color-primary-600: var(--color-blue-600);\n  --color-primary-700: var(--color-blue-700);\n  --color-primary-800: var(--color-blue-800);\n  --color-primary-900: var(--color-blue-900);\n\n  /* use for light and dark blue text */\n  --color-primary-dark: var(--color-primary-700);\n  --color-primary-light: var(--color-slate-400);\n\n  --color-gray-50: var(--color-slate-50);\n  --color-gray-100: var(--color-slate-100);\n  --color-gray-200: var(--color-slate-200);\n  --color-gray-300: var(--color-slate-300);\n  --color-gray-400: var(--color-slate-400);\n  --color-gray-500: var(--color-slate-500);\n  --color-gray-600: var(--color-slate-600);\n  --color-gray-700: var(--color-slate-700);\n  --color-gray-800: var(--color-slate-800);\n  --color-gray-900: var(--color-slate-900);\n\n  /* use for light and dark gray text */\n  --color-gray-dark: var(--color-gray-700);\n  --color-gray-light: var(--color-gray-300);\n\n  /* use for light and dark default text */\n  --color-white: #ffffff;\n  --color-black: var(--color-slate-950);\n}\n\nhtml {\n  @apply text-slate-950;\n}\n"
          compiled: "/*! tailwindcss v4.1.13 | MIT License | https://tailwindcss.com */\n@layer properties{@supports (((-webkit-hyphens:none)) and (not (margin-trim:inline))) or ((-moz-orient:inline) and (not (color:rgb(from red r g b)))){*,:before,:after,::backdrop{--tw-border-style:solid;--tw-leading:initial;--tw-font-weight:initial;--tw-shadow:0 0 #0000;--tw-shadow-color:initial;--tw-shadow-alpha:100%;--tw-inset-shadow:0 0 #0000;--tw-inset-shadow-color:initial;--tw-inset-shadow-alpha:100%;--tw-ring-color:initial;--tw-ring-shadow:0 0 #0000;--tw-inset-ring-color:initial;--tw-inset-ring-shadow:0 0 #0000;--tw-ring-inset:initial;--tw-ring-offset-width:0px;--tw-ring-offset-color:#fff;--tw-ring-offset-shadow:0 0 #0000;--tw-backdrop-blur:initial;--tw-backdrop-brightness:initial;--tw-backdrop-contrast:initial;--tw-backdrop-grayscale:initial;--tw-backdrop-hue-rotate:initial;--tw-backdrop-invert:initial;--tw-backdrop-opacity:initial;--tw-backdrop-saturate:initial;--tw-backdrop-sepia:initial;--tw-text-shadow-color:initial;--tw-text-shadow-alpha:100%;--tw-outline-style:solid}}}@layer theme{:root,:host{--font-sans:Inter,Roboto,\"Helvetica Neue\",\"Arial Nova\",\"Nimbus Sans\",Arial,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,\"Liberation Mono\",\"Courier New\",monospace;--color-blue-100:oklch(93.2% .032 255.585);--color-blue-200:oklch(88.2% .059 254.128);--color-blue-300:oklch(80.9% .105 251.813);--color-blue-500:oklch(62.3% .214 259.815);--color-blue-600:oklch(54.6% .245 262.881);--color-blue-700:oklch(48.8% .243 264.376);--color-blue-800:oklch(42.4% .199 265.638);--color-blue-900:oklch(37.9% .146 265.522);--color-slate-100:oklch(96.8% .007 247.896);--color-slate-200:oklch(92.9% .013 255.508);--color-slate-300:oklch(86.9% .022 252.894);--color-slate-400:oklch(70.4% .04 256.788);--color-slate-500:oklch(55.4% .046 257.417);--color-slate-600:oklch(44.6% .043 257.281);--color-slate-700:oklch(37.2% .044 257.287);--color-slate-800:oklch(27.9% .041 260.0