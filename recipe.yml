name: Atelier
# This key, and only this key, is what makes a recipe selectable as a site
# template in the Drupal CMS installer. It is compared case-sensitively against
# the literal string `Site`; core itself treats `type` as free-form.
# @see \Drupal\drupal_cms_installer\RecipeHandler::scan()
type: Site
description: 'A Drupal CMS site set up as the backend for a Nebula code components codebase. Authoring happens in your editor with React and Tailwind; this template configures the Drupal side that the Canvas CLI pushes to.'

recipes:
  # The Drupal CMS foundation: Gin, the navigation sidebar, dashboards, media
  # types, editorial workflow, SEO and privacy tooling, the `page` content type
  # with its Canvas component tree, the `content_editor` role, and Canvas
  # itself. Everything a Drupal CMS site is expected to have.
  #
  # A site template should be built on this rather than on another site
  # template. Applying it also covers `core/recipes/administrator_role`,
  # `content_editor_role` and the media-type recipes, so this template does not
  # repeat them.
  - drupal_cms_site_template_base
  # Drupal CMS ships a `page` type, not an `article` one. The
  # `related_articles` example component queries `node--article` and reads
  # `field_image`, `uid`, `created`, `title` and `path`, so add it.
  - core/recipes/article_content_type

install:
  # Authentication for the Canvas CLI. The declarative parts live here; the
  # key pair and the consumer secret cannot be shipped in a recipe.
  # @see README.md, "Finish the OAuth setup".
  - canvas_oauth
  - consumers
  - simple_oauth
  # JSON:API, used by code components that read data from this site at runtime.
  - jsonapi
  - jsonapi_resources
  # Exposes /jsonapi/menu_items/{menu}, which the `main_navigation` example
  # component fetches for the `main` menu.
  - jsonapi_menu_items
  # Exposes /jsonapi/index/{index}, which the `search_results` example
  # component queries.
  - jsonapi_search_api
  - search_api
  - search_api_db
  # Content is indexed on cron, so make sure cron runs even without a real
  # cron job.
  - automated_cron
  # A blank shell theme, generated at composer install by
  # `drupal/site_template_helper` from the `extra.drupal-site-template` block
  # in composer.json. It has no templates, no CSS and no SDCs — it renders the
  # Canvas component tree and nothing else, because every pixel of this site's
  # front end comes from the code components you push.
  #
  # Its `header`, `content` and `footer` regions are the targets of the
  # `regions/*.json` files in a Nebula codebase. `content` must be declared:
  # `regions:` replaces the default set wholesale rather than merging with it,
  # and without it main page content and status messages silently disappear.
  # @see \Drupal\Core\Extension\ExtensionList::createExtensionInfo()
  # @see \Drupal\block\Plugin\DisplayVariant\BlockPageVariant::build()
  - atelier_theme

config:
  # Existing configuration wins, so this template can be applied on top of a
  # site that already has some of it.
  strict: false
  import:
    # When a recipe installs a module, core deliberately skips the config
    # *entities* in that module's `config/install`; only simple config is
    # created. Every config entity a module ships has to be imported here.
    # The base recipe already imports `canvas` and `filter`; these are the
    # extensions this template adds on top.
    # @see \Drupal\Core\Recipe\RecipeRunner::installModules()
    #
    # The `canvas:*` OAuth scopes the CLI asks for.
    canvas_oauth: '*'
    # The bundles of the `oauth2_token` entity type. Without these, tokens
    # cannot be stored and every CLI request fails to authenticate.
    simple_oauth: '*'
  actions:
    # The base recipe sets the admin theme to Gin but leaves the front end to
    # the site template, which is this one's job. Gin stays: the shell theme is
    # deliberately unusable for administration.
    system.theme:
      simpleConfigUpdate:
        default: atelier_theme
    # The Canvas landing page shipped in `content/`, same as Drupal CMS's Blank
    # and Starter templates. Dotted, not nested: `simpleConfigUpdate` calls
    # `Config::set()` per key, so a nested `page:` mapping would replace the
    # whole `page` array and wipe the `page.403` the base recipe sets.
    system.site:
      simpleConfigUpdate:
        page.front: /home
    # A visitor should never meet a PHP notice from a contrib module in the
    # middle of the page. Errors still reach the log.
    system.logging:
      simpleConfigUpdate:
        error_level: hide
    # Point Project Browser at the recommended add-ons list this template
    # ships as a file, rather than at a remote URL. Same approach as
    # drupal_cms_blank, and it works on a site with no network access.
    # @see content/file/6b2f19d4-8a07-4e53-91c6-3d05f8be71a2.yml
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources.recommended:
          uri: 'public://recommended-add-ons.yaml'
          ttl: 86400
        default_source: recommended
    # Code components fetch from JSON:API in the visitor's browser, so
    # anonymous users need read access to content and media.
    user.role.anonymous:
      grantPermissions:
        - 'access content'
        - 'view media'
    user.role.authenticated:
      grantPermissions:
        - 'access content'
        - 'view media'
    # The global CSS the components are styled with — the Tailwind build from
    # the Nebula codebase. It has to be a config action rather than a shipped
    # config file: `canvas.asset_library.global` already exists by the time
    # this recipe's config is imported, because the base recipe creates it when
    # it installs Canvas, and a non-strict recipe only imports config that does
    # not exist yet.
    # @see \Drupal\Core\Recipe\ConfigConfigurator::getConfigStorage()
    # BEGIN generated: global CSS. @see tests/regenerate-components.sh
    canvas.asset_library.global:
      setProperties:
        label: 'Global CSS'
        css:
          original: "/*\n * Atelier — design tokens.\n *\n * Near-monochrome on purpose. Colour comes from the content, not the chrome,\n * which is how the WordPress default themes hold together across wildly\n * different sites. Two faces, no third utility face, no bright accent.\n */\n@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap');\n\n@import 'tailwindcss';\n\n@theme {\n  --font-display: Fraunces, 'Iowan Old Style', Georgia, serif;\n  --font-sans: Inter, ui-sans-serif, system-ui, sans-serif;\n\n  /* Warm paper, soft black. The only \"accent\" is the ink itself. */\n  --color-ink: #1a1a18;\n  --color-ink-muted: #6b6a64;\n  --color-paper: #fcfcfa;\n  --color-wash: #f2f1ec;\n  --color-hairline: #e2e0d9;\n  --color-accent: #1a1a18;\n  --color-accent-ink: #fcfcfa;\n\n  --spacing-section-sm: 5rem;\n  --spacing-section-md: 8.5rem;\n  --spacing-section-lg: 12rem;\n}\n\n@layer base {\n  .font-display {\n    font-variation-settings:\n      'opsz' 100,\n      'SOFT' 0,\n      'WONK' 0;\n    letter-spacing: -0.018em;\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-ink);\n    outline-offset: 3px;\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    *,\n    *::before,\n    *::after {\n      animation-duration: 0.01ms !important;\n      transition-duration: 0.01ms !important;\n    }\n  }\n}\n"
          compiled: "/*! tailwindcss v4.1.13 | MIT License | https://tailwindcss.com */\n@import \"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap\";@layer properties{@supports (((-webkit-hyphens:none)) and (not (margin-trim:inline))) or ((-moz-orient:inline) and (not (color:rgb(from red r g b)))){*,:before,:after,::backdrop{--tw-divide-y-reverse:0;--tw-border-style:solid;--tw-leading:initial;--tw-font-weight:initial;--tw-tracking:initial;--tw-outline-style:solid;--tw-duration:initial}}}@layer theme{:root,:host{--font-sans:Inter,ui-sans-serif,system-ui,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,\"Liberation Mono\",\"Courier New\",monospace;--spacing:.25rem;--container-7xl:80rem;--text-lg:1.125rem;--text-lg--line-height:calc(1.75/1.125);--font-weight-light:300;--font-weight-normal:400;--font-weight-medium:500;--tracking-tight:-.025em;--leading-snug:1.375;--default-transition-duration:.15s;--default-transition-timing-function:cubic-bezier(.4,0,.2,1);--default-font-family:var(--font-sans);--default-mono-font-family:var(--font-mono);--font-display:Fraunces,\"Iowan Old Style\",Georgia,serif;--color-ink:#1a1a18;--color-ink-muted:#6b6a64;--color-paper:#fcfcfa;--color-wash:#f2f1ec;--color-hairline:#e2e0d9;--spacing-section-sm:5rem;--spacing-section-md:8.5rem;--spacing-section-lg:12rem}}@layer base{@supports (not ((-webkit-appearance:-apple-pay-button))) or (contain-intrinsic-size:1px){::placeholder{color:currentColor}@supports (color:color-mix(in lab, red, red)){::placeholder{color:color-mix(in oklab,currentcolor 50%,transparent)}}}*,:after,:before,::backdrop{box-sizing:border-box;border:0 solid;margin:0;padding:0}::file-selector-button{box-sizing:border-box;border:0 solid;margin:0;padding:0}html,:host{-webkit-text-size-adjust:100%;tab-size:4;line-height:1.5;font-family:var(--default-font-family,ui-sans-serif,system-ui,sans-serif,\"Apple Color Emoji\",\"Segoe UI