name: Atelier
# This key, and only this key, is what makes a recipe selectable as a site
# template in the Drupal CMS installer. It is compared case-sensitively against
# the literal string `Site`; core itself treats `type` as free-form.
# @see \Drupal\drupal_cms_installer\RecipeHandler::scan()
type: Site
description: 'A marketing site built entirely from Drupal Canvas code components. Eighteen components and five pages ship with it, styled by their own Tailwind build rather than by a theme. Author components in React in your editor, or in Canvas.'

recipes:
  # The Drupal CMS foundation: Gin, the navigation sidebar, dashboards, media
  # types, editorial workflow, SEO and privacy tooling, the `page` content type
  # with its Canvas component tree, the `content_editor` role, and Canvas
  # itself. Everything a Drupal CMS site is expected to have.
  #
  # A site template should be built on this rather than on another site
  # template. Applying it also covers `core/recipes/administrator_role`,
  # `content_editor_role` and the media-type recipes, so this template does not
  # repeat them.
  - drupal_cms_site_template_base
  # Drupal CMS ships a `page` type, not an `article` one. The
  # `article_teasers` component queries `node--article` and reads `title`,
  # `created` and `path`, so add it. It is also what the journal is made of.
  - core/recipes/article_content_type

install:
  # Authentication for the Canvas CLI. The declarative parts live here; the
  # key pair and the consumer secret cannot be shipped in a recipe.
  # @see README.md, "Finish the OAuth setup".
  - canvas_oauth
  - consumers
  - simple_oauth
  # JSON:API, used by code components that read data from this site at runtime.
  - jsonapi
  - jsonapi_resources
  # Exposes /jsonapi/menu_items/{menu}, which the `site_nav` component fetches
  # for the `main` menu.
  - jsonapi_menu_items
  # Exposes /jsonapi/index/{index}, for components that query the search index.
  - jsonapi_search_api
  - search_api
  - search_api_db
  # Content is indexed on cron, so make sure cron runs even without a real
  # cron job.
  - automated_cron
  # A blank shell theme, generated at composer install by
  # `drupal/site_template_helper` from the `extra.drupal-site-template` block
  # in composer.json. It has no templates, no CSS and no SDCs — it renders the
  # Canvas component tree and nothing else, because every pixel of this site's
  # front end comes from the code components you push.
  #
  # Its `header`, `content` and `footer` regions are the targets of the
  # `regions/*.json` files in a paired codebase. `content` must be declared:
  # `regions:` replaces the default set wholesale rather than merging with it,
  # and without it main page content and status messages silently disappear.
  # @see \Drupal\Core\Extension\ExtensionList::createExtensionInfo()
  # @see \Drupal\block\Plugin\DisplayVariant\BlockPageVariant::build()
  - atelier_theme

config:
  # Existing configuration wins, so this template can be applied on top of a
  # site that already has some of it.
  strict: false
  import:
    # When a recipe installs a module, core deliberately skips the config
    # *entities* in that module's `config/install`; only simple config is
    # created. Every config entity a module ships has to be imported here.
    # The base recipe already imports `canvas` and `filter`; these are the
    # extensions this template adds on top.
    # @see \Drupal\Core\Recipe\RecipeRunner::installModules()
    #
    # The `canvas:*` OAuth scopes the CLI asks for.
    canvas_oauth: '*'
    # The bundles of the `oauth2_token` entity type. Without these, tokens
    # cannot be stored and every CLI request fails to authenticate.
    simple_oauth: '*'
  actions:
    # The base recipe sets the admin theme to Gin but leaves the front end to
    # the site template, which is this one's job. Gin stays: the shell theme is
    # deliberately unusable for administration.
    system.theme:
      simpleConfigUpdate:
        default: atelier_theme
    # The Canvas landing page shipped in `content/`, same as Drupal CMS's Blank
    # and Starter templates. Dotted, not nested: `simpleConfigUpdate` calls
    # `Config::set()` per key, so a nested `page:` mapping would replace the
    # whole `page` array and wipe the `page.403` the base recipe sets.
    system.site:
      simpleConfigUpdate:
        page.front: /home
    # A visitor should never meet a PHP notice from a contrib module in the
    # middle of the page. Errors still reach the log.
    system.logging:
      simpleConfigUpdate:
        error_level: hide
    # Point Project Browser at the recommended add-ons list this template
    # ships as a file, rather than at a remote URL. Same approach as
    # drupal_cms_blank, and it works on a site with no network access.
    # @see content/file/6b2f19d4-8a07-4e53-91c6-3d05f8be71a2.yml
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources.recommended:
          uri: 'public://recommended-add-ons.yaml'
          ttl: 86400
        default_source: recommended
    # Code components fetch from JSON:API in the visitor's browser, so
    # anonymous users need read access to content and media.
    user.role.anonymous:
      grantPermissions:
        - 'access content'
        - 'view media'
    user.role.authenticated:
      grantPermissions:
        - 'access content'
        - 'view media'
    # The global CSS the components are styled with — their Tailwind build. It
    # has to be a config action rather than a shipped
    # config file: `canvas.asset_library.global` already exists by the time
    # this recipe's config is imported, because the base recipe creates it when
    # it installs Canvas, and a non-strict recipe only imports config that does
    # not exist yet.
    # @see \Drupal\Core\Recipe\ConfigConfigurator::getConfigStorage()
    # BEGIN generated: global CSS. @see tests/regenerate-components.sh
    canvas.asset_library.global:
      setProperties:
        label: 'Global CSS'
        css:
          original: "/*\n * Atelier — design tokens.\n *\n * Paper and ink, warm and near-monochrome, with the hairline rule as the only\n * structural device. There is no accent colour: the photographs are the colour,\n * and a palette that stays out of their way is what lets a row of them read as\n * one body of work.\n */\n@import 'tailwindcss';\n\n/*\n * Self-hosted, latin subset, variable. Not Google Fonts: this template installs\n * Drupal CMS's privacy tooling, and sending every anonymous visitor's address\n * to a third party before the first paint contradicts that. It is also two\n * fewer round trips before the display face renders.\n *\n * The files ship as content alongside the imagery. Replace them and these two\n * rules if you swap the typefaces.\n */\n@font-face {\n  font-family: Fraunces;\n  font-style: normal;\n  font-weight: 300 500;\n  font-display: swap;\n  src: url('/sites/default/files/atelier-fraunces.woff2') format('woff2');\n}\n\n@font-face {\n  font-family: Inter;\n  font-style: normal;\n  font-weight: 400 500;\n  font-display: swap;\n  src: url('/sites/default/files/atelier-inter.woff2') format('woff2');\n}\n\n@theme {\n  --font-display: Fraunces, 'Iowan Old Style', Georgia, serif;\n  --font-sans: Inter, ui-sans-serif, system-ui, sans-serif;\n\n  /* Warm stock, soft black. Paper and wash share a temperature so alternating\n     them reads as a value step rather than as a hue shift. */\n  --color-ink: #1a1a18;\n  --color-ink-muted: #6b6a64;\n  --color-paper: #faf8f3;\n  --color-wash: #efece4;\n  /* Strong enough to survive at 1px, because the rule is the only structural\n     device this design has. */\n  --color-hairline: #cbc7bb;\n\n  /* One page rail. Every band that spans the page uses this and nothing else,\n     so the left edge never moves as a reader goes down the page. */\n  --container-page: 82rem;\n  /* The reading measure, applied to the text block rather than the container. */\n  --container-measure: 38rem;\n  --container-intro: 42rem;\n\n  --text-caption: 0.9375rem;\n  --text-body: 1.0625rem;\n  /* A standfirst has to be a step above body, or a lede and a paragraph are\n     the same thing set twice. */\n  --text-lede: 1.3125rem;\n  /* One size for every small title. Three tokens a quarter-rem apart read as\n     an accident rather than a hierarchy, and nothing was distinguishing them. */\n  --text-title: 1.25rem;\n  /* The step that was missing: nothing existed between the 56px section\n     heading and the 20px titles under it. */\n  --text-section: 2rem;\n\n  --spacing-section-sm: 4rem;\n  --spacing-section-md: 6rem;\n  --spacing-section-lg: 8rem;\n  /* The gap between components stacked inside one section. Section owns this,\n     so an editor stacking two components never has to know about margins. */\n  --spacing-rhythm: 3.5rem;\n}\n\n@layer base {\n  /*\n   * The components paint their own bands, but nothing painted the page itself,\n   * so every hydration flashed white and a short page ended in a white strip\n   * below the footer.\n   */\n  html {\n    background-color: var(--color-paper);\n    color: var(--color-ink);\n  }\n\n  .font-display {\n    /* Fraunces' optical size axis exists so that a 22px title and an 88px\n       headline get different letterforms. Let it do that. */\n    font-optical-sizing: auto;\n  }\n\n  /*\n   * The label style: letterspaced caps at caption size, taken from the way a\n   * catalogue keys a plate. Used for band labels, sequence markers, piece\n   * references — anything that names a thing rather than saying it.\n   */\n  .text-key {\n    font-size: 0.8125rem;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n  }\n\n  /* Negative tracking is a display-size correction. Applying it to a 20px\n     title just closes up apertures that were already tight. */\n  .tracking-display {\n    letter-spacing: -0.018em;\n  }\n\n  /*\n   * Inverted ground. Section swaps the meaning of the tokens rather than\n   * overriding colours per component, so every child — muted text, buttons,\n   * rules, the focus ring — follows without knowing it is on a dark band.\n   */\n  /* Scoped, not terminal: a paper band nested in an ink one gets the light\n     tokens back rather than inheriting the inversion for good. */\n  [data-scheme='paper'] {\n    --color-ink: #1a1a18;\n    --color-ink-muted: #6b6a64;\n    --color-paper: #faf8f3;\n    --color-wash: #efece4;\n    --color-hairline: #cbc7bb;\n  }\n\n  [data-scheme='ink'] {\n    --color-ink: #f7f5f0;\n    --color-ink-muted: #a6a49a;\n    --color-paper: #191917;\n    --color-wash: #232320;\n    --color-hairline: #3b3a35;\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-ink);\n    outline-offset: 3px;\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    *,\n    *::before,\n    *::after {\n      animation-duration: 0.01ms !important;\n      transition-duration: 0.01ms !important;\n    }\n  }\n}\n\n/*\n * Navigation submenu.\n *\n * Hand-written rather than Tailwind utilities because the second level is\n * positioned, and a dropdown that only opens on :hover is unusable by\n * keyboard. :focus-within opens it for tab users and for a tap on the parent,\n * so no script is involved and nothing has to be re-opened after a repaint.\n *\n * Below the header's breakpoint there is nowhere to drop to, so the second\n * level stays in flow and simply indents.\n */\n@layer components {\n  .nav-item {\n    position: relative;\n  }\n\n  .nav-submenu {\n    display: flex;\n    flex-wrap: wrap;\n    column-gap: 1rem;\n    padding-left: 0.75rem;\n    margin-top: 0.375rem;\n    border-left: 1px solid var(--color-hairline);\n  }\n\n  @media (min-width: 48rem) {\n    .nav-submenu {\n      position: absolute;\n      top: 100%;\n      left: -0.875rem;\n      z-index: 30;\n      display: block;\n      min-width: 12rem;\n      margin-top: 0;\n      padding: 0.75rem 0.875rem 0.875rem;\n      border: 1px solid var(--color-hairline);\n      border-radius: 0;\n      background-color: var(--color-paper);\n      opacity: 0;\n      visibility: hidden;\n      transform: translateY(-0.25rem);\n      transition:\n        opacity 150ms ease,\n        transform 150ms ease,\n        visibility 150ms;\n    }\n\n    .nav-submenu > li + li {\n      margin-top: 0.375rem;\n    }\n\n    .nav-item:hover > .nav-submenu,\n    .nav-item:focus-within > .nav-submenu {\n      opacity: 1;\n      visibility: visible;\n      transform: translateY(0);\n    }\n  }\n}\n"
          compiled: "/*! tailwindcss v4.1.13 | MIT License | https://tailwindcss.com */\n@layer properties{@supports (((-webkit-hyphens:none)) and (not (margin-trim:inline))) or ((-moz-orient:inline) and (not (color:rgb(from red r g b)))){*,:before,:after,::backdrop{--tw-divide-y-reverse:0;--tw-border-style:solid;--tw-leading:initial;--tw-font-weight:initial;--tw-outline-style:solid;--tw-blur:initial;--tw-brightness:initial;--tw-contrast:initial;--tw-grayscale:initial;--tw-hue-rotate:initial;--tw-invert:initial;--tw-opacity:initial;--tw-saturate:initial;--tw-sepia:initial;--tw-drop-shadow:initial;--tw-drop-shadow-color:initial;--tw-drop-shadow-alpha:100%;--tw-drop-shadow-size:initial;--tw-duration:initial;--tw-content:\"\"}}}@layer theme{:root,:host{--font-sans:Inter,ui-sans-serif,system-ui,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,\"Liberation Mono\",\"Courier New\",monospace;--spacing:.25rem;--font-weight-light:300;--font-weight-normal:400;--font-weight-medium:500;--leading-snug:1.375;--default-transition-duration:.15s;--default-transition-timing-function:cubic-bezier(.4,0,.2,1);--default-font-family:var(--font-sans);--default-mono-font-family:var(--font-mono);--font-display:Fraunces,\"Iowan Old Style\",Georgia,serif;--color-ink:#1a1a18;--color-ink-muted:#6b6a64;--color-paper:#faf8f3;--color-wash:#efece4;--color-hairline:#cbc7bb;--container-page:82rem;--container-measure:38rem;--container-intro:42rem;--text-caption:.9375rem;--text-body:1.0625rem;--text-lede:1.3125rem;--text-title:1.25rem;--text-section:2rem;--spacing-section-sm:4rem;--spacing-section-md:6rem;--spacing-section-lg:8rem;--spacing-rhythm:3.5rem}}@layer base{@supports (not ((-webkit-appearance:-apple-pay-button))) or (contain-intrinsic-size:1px){::placeholder{color:currentColor}@supports (color:color-mix(in lab, red, red)){::placeholder{color:color-mix(in oklab,currentcolor 50%,transparent)}}}*,:after,:before,::backdrop{box-sizing:border-box;border:0 solid;margin:0;paddin