  field_content:
    -
      value: '<p>This site stores nothing about you beyond what Drupal needs in order to serve a page: a session identifier if you sign in, and ordinary web server logs. There is no analytics, no advertising, and no third-party tracking.</p><p>If you email the studio, we keep the correspondence until the piece is delivered and for six years after that, because that is how long we have to keep records of work. We do not pass it on.</p><p><strong>Replace this page before you launch.</strong> It describes what this site template does, which is very little. It does not describe what your site does.</p>'
