  body:
    -
      value: '<p>People ask what we finish with, expecting a name. It is raw linseed oil, thinned for the first two coats, and about three weeks.</p><h2>Why not a hard finish</h2><p>A lacquer or a hard-wax oil gives you a film, and a film is a thing that can be scratched through. Once it is, you cannot repair it locally; you strip the whole top and start again. An oiled surface has no film to break.</p><blockquote><p>A dining table gets a wet glass on it in the first fortnight. The question is not whether it happens but what you have to do afterwards.</p></blockquote><drupal-media data-entity-type="media" data-entity-uuid="325262a6-f56c-44f1-8591-5c29944def85" data-align="center" data-caption="Rags go in a bucket of water at the end of the day. Oily rags in a bin are a fire, not a metaphor."></drupal-media><h2>The schedule</h2><p>Two thinned coats a day apart, then four full-strength coats at three-day intervals, then three more over the following fortnight as it will take them. Each one is wiped back within twenty minutes. What is left is what soaked in.</p><p>The owner re-oils it once a year with a cloth and half an hour. That is the whole maintenance schedule, and it is the reason we use it.</p>'
      format: content_format
      summary: 'The finish on most of our work is raw linseed oil and time. Here is why we stopped using anything harder.'
