  body:
    -
      value: '<p>A visitor asked last week why there are no screws in the bench by the window. The short answer is that a screw is a repair waiting to happen: the timber moves, the thread stays where it is, and in ten years the joint is loose and the only fix is a bigger screw.</p><h2>How the joint works</h2><p>The long answer is that a wedged through-tenon does the same job and gets tighter. The tenon passes through the top and stands a little proud. Two saw kerfs are cut into the end grain, and two oak wedges are driven in, which spreads the tenon inside the mortice.</p><blockquote><p>The joint is mechanical. Nothing holds it but its own geometry.</p></blockquote><drupal-media data-entity-type="media" data-entity-uuid="1c0a436d-64ea-474b-bd60-bb8d1b311777" data-align="center" data-caption="Where the top meets the leg. No fixing crosses this line."></drupal-media><h2>It comes apart</h2><p>Knock the wedges out and the bench is three pieces that fit in a van. We have taken two of them back for re-wedging after a decade in a kitchen with underfloor heating, which is about the worst thing you can do to a piece of ash.</p><h2>What it costs</h2><p>The cost is time. A wedged tenon takes an hour that a screw takes a minute. We charge for the hour and explain why, and most people say yes.</p>'
      format: content_format
      summary: 'Why there are no screws in the bench by the window, and what a wedged through-tenon does instead.'
