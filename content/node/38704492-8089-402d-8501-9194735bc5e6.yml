  body:
    -
      value: '<p>For about four years now most of our ash has come from one woodland near Selborne, eleven miles from the workshop. They mill on site and stack under cover, and we buy the whole board rather than a cutting list.</p><p>Buying whole boards is the part that matters. A merchant selling by the cube has every reason to give you the pieces nobody else wanted; buying the board means the grain runs where we want it to and a table top can come from one tree rather than four. It also means we carry stock we have no immediate use for, which is expensive and occasionally stupid.</p><p>Ash has had a hard decade. Dieback has taken a great deal of it, and a lot of what is coming to market now is standing dead timber felled for safety. It is perfectly good if it is milled quickly and dried properly. It is firewood if it sits.</p><p>We air-dry for a year to the inch and finish in the kiln. Nothing goes into a piece above twelve per cent, and everything that is going into a heated house sits in the workshop for a month first.</p>'
