# The home page.
#
# Deliberately a `page` node with rich text rather than a Canvas page built
# from components. A Canvas component tree can only reference components that
# already exist, and on this site every component arrives later, from your
# Nebula codebase, via `canvas push`. A template that shipped a component-built
# home page would either have to vendor a copy of those components as config —
# duplicating the codebase it is meant to pair with — or ship a page that fails
# to render on a fresh install.
#
# So the shipped pages are plain content, which renders under any theme, and
# the component-built front end is what you push on top.
#
# No `path` alias: Pathauto's `/[node:title]` pattern generates `/home` from
# the title, and a hand-written alias would only be overwritten.
_meta:
  version: '1.0'
  entity_type: node
  uuid: 4d81a3f6-9b52-4e07-a1c8-6e2f0b73d59a
  bundle: page
  default_langcode: en
default:
  revision_uid:
    -
      target_id: 1
  status:
    -
      value: true
  uid:
    -
      target_id: 1
  title:
    -
      value: Home
  promote:
    -
      value: false
  sticky:
    -
      value: false
  revision_translation_affected:
    -
      value: true
  moderation_state:
    -
      value: published
  field_description:
    -
      value: 'The Drupal side of a Nebula code components setup.'
  field_content:
    # One element per line, with no newlines inside a paragraph:
    # `content_format` runs `filter_autop`, which turns source line breaks into
    # <br> and hard-wraps the rendered text.
    -
      format: content_format
      value: "<h2>Your front end lives in code</h2>\r\n<p>This site is the backend for a Nebula codebase. Components are authored in React, pushed here with the Canvas CLI, and composed into pages by editors — no deploy in between.</p>\r\n<p>The theme is a blank shell on purpose. It ships no CSS, no templates and no components of its own, so nothing competes with the styling that arrives with your components. That is also why this page looks unstyled: there is nothing to style it yet.</p>\r\n<h2>Next</h2>\r\n<p>Scaffold a codebase with <strong>npx @drupal-canvas/create</strong>, point it at this site, and run <strong>npx canvas push</strong>. Your components, page regions and pages replace what you are looking at. The recipe README has the full walkthrough, including the one-time OAuth setup.</p>"
