      component_id: js.text
      inputs:
        text: '<p>This site pairs with a <strong>Nebula</strong> codebase. The components it renders are authored there as React files and pushed here with the Drupal Canvas CLI. Editors then compose pages from them in Canvas, the same way this page was composed.</p><p>The theme is a blank shell: no CSS, no templates, no components of its own. Everything you see is either Drupal content or a pushed component, so there is no Drupal design system competing with your own.</p><p>Replace this page with something of your own — it exists so a freshly installed site has more than a home page.</p>'
