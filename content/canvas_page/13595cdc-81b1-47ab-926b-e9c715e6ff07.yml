        title: 'Start with a photograph'
        lede: 'A photograph of the room and a rough size is enough for a first drawing.'
    -
      parent_uuid: afbd02c5-2591-4263-b36e-32bc2da40ee0
      slot: content
      uuid: 3072641e-af37-4a98-926c-9c8b4aa14af5
