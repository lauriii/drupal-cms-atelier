      component_id: js.feature
      inputs:
        title: 'We come and measure'
        text: '<p>An hour in the room with a tape and a camera. We measure the route in as well as the room, because a 2.4 metre top has to get through the door.</p>'
        framed: true
        level: h3
    -
      parent_uuid: 69e1ccbf-196e-4de0-84cc-583c39406010
      slot: content
      uuid: ad8f6f03-5a12-474e-92ef-515c8ebc80d0
      component_id: js.feature
      inputs:
        title: 'You get a drawing, not a mood board'
        text: '<p>A dimensioned elevation, and full size for the joints that matter. It is the thing we both agree to.</p>'
        framed: true
        level: h3
    -
      parent_uuid: 69e1ccbf-196e-4de0-84cc-583c39406010
      slot: content
      uuid: 61b5f2a7-0172-40db-8b42-4ac698b4db99
      component_id: js.feature
      inputs:
        title: 'Joinery that can be taken apart'
        text: '<p>Wedged through-tenons and drawbored mortices. Nothing structural relies on glue alone, so a piece can be knocked apart, re-wedged, and put back into use.</p>'
        framed: true
        level: h3
