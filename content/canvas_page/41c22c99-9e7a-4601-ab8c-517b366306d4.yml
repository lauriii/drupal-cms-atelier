      component_id: js.feature
      inputs:
        marker: '1'
        title: 'You describe the piece'
        text: 'What it has to hold, where it goes, and how much room there is. We visit if you are within an hour of the workshop.'
        framed: false
        level: h3
    -
      parent_uuid: 7f2a1c33-0007-4a00-8000-000000000007
