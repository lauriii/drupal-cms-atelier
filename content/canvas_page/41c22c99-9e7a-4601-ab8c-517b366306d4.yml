      component_id: js.section_intro
      inputs:
        eyebrow: ''
        title: 'How a commission goes'
        lede: 'Three steps, in this order, every time. Nothing is made before the second one is signed off.'
        align: left
        level: h2
    -
      parent_uuid: 7f2a1c33-0005-4a00-8000-000000000005
