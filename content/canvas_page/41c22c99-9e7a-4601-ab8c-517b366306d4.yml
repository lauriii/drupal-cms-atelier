      uuid: 7f2a1c33-0004-4a00-8000-000000000004
      component_id: js.prose
      inputs:
        text: "<p>Everything is made here. We do not subcontract carcassing, we do not buy in doors, and we do not finish anything in a spray booth on an industrial estate forty miles away. It is slower and it is the entire point.</p><p>Timber comes from two merchants we have used for fifteen years, and increasingly from a single woodland near Selborne that mills its own ash. We work in solid stock. Where a piece needs a panel we make the panel.</p><p>We do not stain. If a client wants a darker piece we find a darker timber, which costs more and takes longer and looks correct in ten years' time.</p>"
    -
      uuid: 7f2a1c33-0005-4a00-8000-000000000005
      component_id: js.section
