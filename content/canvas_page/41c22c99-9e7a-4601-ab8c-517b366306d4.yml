      component_id: js.feature
      inputs:
        marker: '2'
        title: 'We draw it and price it'
        text: 'A dimensioned drawing and a fixed price, inside two weeks. Both are yours to keep whether or not you go ahead.'
        framed: false
        level: h3
    -
      parent_uuid: 7f2a1c33-0007-4a00-8000-000000000007
