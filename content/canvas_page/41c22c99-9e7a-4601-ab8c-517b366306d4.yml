      uuid: a3f19c62-0002-4a00-8000-000000000002
      component_id: js.prose
      inputs:
        text: "<p>Everything is made here. We don't subcontract carcassing, we don't buy in doors, and nothing gets finished in a spray booth on an industrial estate forty miles away.</p><p>Timber comes from two merchants we've used for fifteen years, and increasingly from one woodland near Selborne that mills its own ash. We work in solid stock; where a piece needs a panel, we make the panel.</p><p>We don't stain. If you want a darker piece we find a darker timber.</p>"
