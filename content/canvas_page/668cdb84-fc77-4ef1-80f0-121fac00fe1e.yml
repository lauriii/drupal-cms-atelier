      component_id: js.feature
      inputs:
        title: 'Jigs, not memory'
        text: '<p>Every repeated cut gets a jig, dated and named on the side. It is how a Thursday afternoon comes out like a Monday morning.</p>'
        framed: true
        level: h3
    -
      parent_uuid: b9e504d4-a572-4b9b-9ae8-fd40805e6e55
      slot: content
      uuid: 7df11ca8-69cc-48e4-b14e-73b2e9997863
      component_id: js.feature
      inputs:
        title: 'Batches of twenty'
        text: '<p>Cutting the whole run at once is faster until a dimension is wrong and you have two hundred of the mistake. We check against a master every twenty.</p>'
        framed: true
        level: h3
    -
      parent_uuid: b9e504d4-a572-4b9b-9ae8-fd40805e6e55
      slot: content
      uuid: 5caf00dc-bac7-4374-a95f-9b7bdb87e466
      component_id: js.feature
      inputs:
        title: 'Parts, not pieces'
        text: '<p>Backs and seats come off. A damaged one is a part to replace, not a chair to remake.</p>'
        framed: true
        level: h3
