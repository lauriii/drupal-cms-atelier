      component_id: js.text
      inputs:
        text: '<p>This site is the backend for a Nebula codebase. Components are authored in React, pushed here with the Canvas CLI, and composed into pages by editors — no deploy in between. This page is built from those components.</p>'
        textSize: large
        textColor: dark
    -
