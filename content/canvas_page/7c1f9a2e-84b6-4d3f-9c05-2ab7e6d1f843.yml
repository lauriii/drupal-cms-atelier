# The home page: a Canvas landing page, which is the pattern Drupal CMS's own
# Blank and Starter templates use, at the same `/home` path Starter uses.
#
# A Canvas page rather than a node on purpose. Drupal CMS ships Pathauto with a
# `/[node:title]` pattern, so a node cannot keep a hand-written alias from a
# recipe (Pathauto's opt-out is a computed field property that default content
# cannot set). Canvas pages have no Pathauto pattern, so this alias sticks.
#
# Built only from Mercury SDCs, so it renders on a fresh install with nothing
# pushed yet. Every enum value below comes from the component's own
# `*.component.yml`; Canvas validates them on save.
#
# Nebula's `examples/pages/homepage.json` also targets `/home`. Pushing it
# without adopting this page first leaves two pages on one alias, and the newer
# one wins path lookups. See README.md, "Get a component onto the site".
