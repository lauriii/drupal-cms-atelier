# The home page, composed from the Nebula code components this template ships.
#
# A Canvas page rather than a node: Drupal CMS's Pathauto pattern would rewrite
# a node's alias, and more importantly a node's body is plain rich text, which
# renders unstyled once the components' Tailwind build resets the page.
#
# Every component id and enum value below comes from the vendored
# `config/canvas.js_component.*.yml`. Canvas validates them on save and drops
# anything that does not match, so tests/check.sh asserts the tree survived.
_meta:
  version: '1.0'
  entity_type: canvas_page
  uuid: 7c1f9a2e-84b6-4d3f-9c05-2ab7e6d1f843
  default_langcode: en
default:
  revision_user:
    -
      target_id: 1
  status:
    -
      value: true
  owner:
    -
      target_id: 1
  title:
    -
      value: Home
  components:
