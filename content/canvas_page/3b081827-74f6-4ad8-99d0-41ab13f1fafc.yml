      component_id: js.feature
      inputs:
        title: 'We keep the surface'
        text: '<p>A stripped patina is gone for good and it takes the age with it. We refinish only where there is nothing left to keep.</p>'
        framed: true
        level: h3
    -
      parent_uuid: 85ff34ff-b741-4626-817a-e2e3fee97375
      slot: content
      uuid: 927f2497-6784-4db7-a895-2e5ff8cdefbd
      component_id: js.feature
      inputs:
        title: 'The joint is usually the problem'
        text: '<p>A loose chair is almost always failed glue in the mortices rather than broken timber. That is a day, not a rebuild.</p>'
        framed: true
        level: h3
    -
      parent_uuid: 85ff34ff-b741-4626-817a-e2e3fee97375
      slot: content
      uuid: 3d751e37-e95c-416c-bcc8-a87fb3dffa7a
      component_id: js.feature
      inputs:
        title: 'We say when not to'
        text: '<p>If the hours are worth more than the piece we tell you, and we do not charge for looking.</p>'
        framed: true
        level: h3
