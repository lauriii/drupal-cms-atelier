    -
      parent_uuid: 3330086a-980b-4fa0-83a6-9fdf05e08aa2
      slot: content
      uuid: cbf25ed6-b088-427f-9c13-28e0328b2caa
      component_id: js.disclosure
      inputs:
        title: 'How long does a commission take?'
        text: '<p>Between ten and sixteen weeks from the deposit, depending on what is in the rack. A dining table is usually fourteen. We tell you the week, not the month, once the timber is chosen.</p>'
        level: h2
        open: false
    -
      parent_uuid: 3330086a-980b-4fa0-83a6-9fdf05e08aa2
      slot: content
      uuid: 69a5fecf-171e-4150-9ab0-1a7b284efa70
      component_id: js.disclosure
      inputs:
        title: 'How do you quote?'
        text: '<p>A fixed price, given after the drawing and held unless the brief changes. It covers the timber, the making, the finish, and delivery within the south of England.</p>'
        level: h2
        open: false
    -
      parent_uuid: 3330086a-980b-4fa0-83a6-9fdf05e08aa2
      slot: content
      uuid: e3bad7a7-d3e6-45b0-8f4a-dce3b9bdd29c
      component_id: js.disclosure
      inputs:
        title: 'Do you deliver and install?'
        text: '<p>Ourselves, anywhere in the south of England, in our own van. Further than that we crate and use a specialist. We take the packaging away with us.</p>'
        level: h2
        open: false
    -
      parent_uuid: 3330086a-980b-4fa0-83a6-9fdf05e08aa2
      slot: content
      uuid: 4f4f506d-57dd-4f5f-aa7e-26b124402d89
      component_id: js.disclosure
      inputs:
        title: 'Can you match an existing piece?'
        text: '<p>Usually, though matching a finish is harder than matching a shape. Send photographs in daylight and we will tell you honestly whether we can get close.</p>'
        level: h2
        open: false
    -
      parent_uuid: 3330086a-980b-4fa0-83a6-9fdf05e08aa2
      slot: content
      uuid: 7e435a16-4cb8-4f1a-9fa3-46b14a6fe96e
      component_id: js.disclosure
      inputs:
        title: 'What timber do you use?'
        text: '<p>Mostly English ash, oak, and douglas fir, bought as whole boards from a woodland near Selborne. We will work in walnut and cherry. We do not use tropical hardwoods.</p>'
        level: h2
        open: false
    -
      parent_uuid: 3330086a-980b-4fa0-83a6-9fdf05e08aa2
      slot: content
      uuid: f1093912-cb3e-4b50-a70d-01a16c6b89b9
      component_id: js.disclosure
      inputs:
        title: 'How should I look after it?'
        text: '<p>Re-oil once a year with a cloth and half an hour. Coasters are not necessary; the finish is repairable in place. Keep it out of the path of underfloor heating if you can.</p>'
        level: h2
        open: false
    -
      parent_uuid: 3330086a-980b-4fa0-83a6-9fdf05e08aa2
      slot: content
      uuid: 3a0e6c38-d62e-4589-b234-aba543f3fafa
      component_id: js.disclosure
      inputs:
        title: 'Do you do repairs?'
        text: "<p>On our own work, always, and usually for free in the first five years. On other people's work, yes, if the piece is worth the hours. We will say if it is not.</p>"
        level: h2
        open: false
    -
      parent_uuid: 3330086a-980b-4fa0-83a6-9fdf05e08aa2
      slot: content
      uuid: 3aba9426-7ba3-45e6-808f-b638ddcb6697
      component_id: js.disclosure
      inputs:
        title: 'What do you need from me to start?'
        text: '<p>A photograph of the room and a rough size. That is genuinely enough for a first drawing. We visit anything over two metres if you are within an hour of the workshop.</p>'
        level: h2
        open: false
